<style>
/* layout: one centered 5:3 stage; character-select screen replaces it between runs; touch pad below (portrait) or overlaid (landscape) */
:root{

  --gold:#ffc857; --hp:#ff5d6c; --energy:#4fc3ff; --ice:#8fd3ff;
  --font:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden,[hidden]{display:none!important}

/* menu */
.menu{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.menu h1{font-size:clamp(34px,8vw,56px);margin:6px 0 0;letter-spacing:.08em;font-weight:400;color:var(--gold);text-wrap:balance}
.menu .sub{color:var(--muted);margin:0;max-width:52ch;line-height:1.6}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:2px solid var(--line);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--gold);background:#222740}
.card canvas{width:72px;height:80px;image-rendering:pixelated;align-self:flex-start}
.card b{font-size:20px;font-weight:400}
.card .st{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.card .st i{font-style:normal}
.card .sk{font-size:13px;line-height:1.5;color:var(--ice)}
.card .go{margin-top:auto;color:var(--gold);font-size:14px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;color:var(--muted);font-size:13px;line-height:1.5;margin:0;padding:0;list-style:none}
.keys kbd{font-family:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:1px 6px}
.best{color:var(--muted);font-size:13px;margin:0}

/* hub */
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wallet{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wallet span{background:var(--panel);border:1px solid var(--line);padding:3px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:2px solid var(--line);padding:6px 14px;font-size:14px}
.tabs button[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.row2 input{background:var(--panel);border:2px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px;padding:6px 8px;min-width:0;width:11em}
.row2 input:focus-visible{outline:2px solid var(--gold)}
.card.lock{opacity:.85}
.card.sel{border-color:var(--gold)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.item{background:var(--panel);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.item b{font-weight:400;font-size:15px}
.item small{color:var(--muted);font-size:12.5px;line-height:1.5}
.item .btn{align-self:flex-start;margin-top:4px;font-size:13px;padding:5px 12px}
.item .btn[disabled]{opacity:.45;cursor:not-allowed}
.lv{color:var(--gold);font-size:12px}
table.lb{border-collapse:collapse;width:100%;font-size:14px}
table.lb th,table.lb td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.lb th{color:var(--muted);font-weight:400;font-size:12.5px}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin:0;max-width:70ch}
.tw{overflow-x:auto}


.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#241a00;padding:8px 16px;font-size:14px;z-index:50;max-width:90vw}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.brow .btn{margin-top:0!important}
canvas.lobby,canvas.homecv{width:100%;max-width:640px;image-rendering:pixelated;border:2px solid var(--line);background:#161a28;align-self:flex-start}
canvas.pcv{width:48px;height:40px;image-rendering:pixelated}
.item.sel{border-color:var(--gold)}.modb{text-align:left}
.decs{display:flex;gap:6px;flex-wrap:wrap}.decs .btn{font-size:13px;padding:5px 10px}
.decs .btn[disabled]{opacity:.45}
.bar{height:6px;background:#2c3348}.bar i{display:block;height:100%;background:var(--gold)}
#bCap{background:rgba(255,209,102,.25);border-color:var(--gold)}

.chatin{position:absolute;left:8px;right:8px;bottom:62px;z-index:4;background:rgba(10,12,18,.9);border:2px solid var(--gold);color:var(--ink);font-family:inherit;font-size:15px;padding:6px 10px}
.chatlog{max-height:180px;overflow-y:auto;background:var(--panel);border:2px solid var(--line);padding:8px;font-size:13px;line-height:1.6;min-width:0}
.chatlog .dm{color:#ff9bd6}.chatlog .sys{color:var(--muted)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}.dot.on{background:#6ee7b7}
.range{width:200px}
textarea.ex{width:100%;min-height:70px;background:var(--panel);color:var(--ink);border:2px solid var(--line);font-size:12px;padding:6px}
/* game */
.game{max-width:960px;margin:0 auto}
.stage{position:relative;width:100%;max-width:min(960px,calc((100dvh - var(--reserve,44px)) * 1.6667));margin:0 auto;aspect-ratio:5/3;container-type:inline-size;background:#0b0d13;border:2px solid var(--line)}
canvas#c{width:100%;height:100%;display:block;touch-action:none;outline:none}
.ov{position:absolute;inset:0;background:rgba(10,12,18,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;text-align:center;padding:2cqw}
.ov h2{margin:0;font-weight:400;font-size:clamp(20px,6cqw,44px);color:var(--gold)}
.ov p{margin:0;color:var(--ink);font-size:clamp(12px,2.4cqw,18px);line-height:1.6;max-width:60ch}
.ov .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel);border:2px solid var(--line);padding:8px 16px;font-size:clamp(12px,2.4cqw,17px)}
.btn:hover{border-color:var(--gold)}
.btn.main{background:var(--gold);color:#241a00;border-color:var(--gold)}
.hint{max-width:960px;margin:8px auto 0;color:var(--muted);font-size:12.5px;line-height:1.6;text-align:center}

/* touch pad */
.pad{display:none}
@media (pointer:coarse){
  :root{--reserve:230px}
  .hint{display:none}
  .pad{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px;padding:10px 4px 0;touch-action:none;user-select:none;-webkit-user-select:none}
}
.stick{width:124px;height:124px;border-radius:50%;border:2px solid var(--line);background:rgba(27,31,45,.7);position:relative;touch-action:none;justify-self:start}
.knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--gold);opacity:.85}
.acts{justify-self:end;display:grid;grid-template-columns:repeat(3,auto);gap:8px;align-items:center}
.tb{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);background:rgba(27,31,45,.8);font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
.tb.fire{width:84px;height:84px;background:rgba(255,93,108,.35);border-color:var(--hp);grid-row:span 2;font-size:16px}
@media (pointer:coarse) and (orientation:landscape){
  :root{--reserve:8px}
  .pad{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
  .pad>*{pointer-events:auto}
  .stick{opacity:.7}
  .tb{opacity:.8}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main>
  <section class="menu" id="menu">
    <header class="mh"><h1>魔晶地牢</h1><div class="wallet" id="wallet"></div></header>
    <nav class="tabs" id="tabs"></nav>
    <div id="tabBody"></div>
    <p class="best" id="best"></p>
  </section>

  <section class="game hidden" id="game">
    <div class="stage" id="stage">
      <canvas id="c" width="800" height="480" tabindex="0"></canvas>
      <input id="chatIn" class="chatin" hidden maxlength="60" placeholder="輸入訊息，Enter 送出，Esc 取消" autocomplete="off">
      <div class="ov" id="ov" hidden>
        <h2 id="ovT"></h2>
        <p id="ovS"></p>
        <div class="row" id="ovB"></div>
      </div>
    </div>
    <div class="pad" id="pad">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <div class="acts">
        <button class="tb" id="bSkill" type="button">技能</button>
        <button class="tb" id="bSkill2" type="button">技能2</button>
        <button class="tb" id="bSwap" type="button">換槍</button>
        <button class="tb fire" id="bFire" type="button">射擊</button>
        <button class="tb" id="bUse" type="button">互動</button>
        <button class="tb" id="bDash" type="button">閃避</button>
        <button class="tb" id="bCap" type="button">捕捉</button>
        <button class="tb" id="bChat" type="button">聊天</button>
      </div>
    </div>
    <div class="hint">WASD 移動・滑鼠射擊・Shift 閃避・空白鍵/右鍵 技能1・R 技能2・Q 換武器・E 互動・T 自動瞄準・Esc 暫停</div>
  </section>
</main>

/* ---------- audio ---------- */
function sfx(f,d,type,v,slide){
  if(muted||SET.vol<=0)return;
  try{
    if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
    const a=audio;if(a.state==='suspended')a.resume();
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime((v||.04)*SET.vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- seeded rng (shared layouts for co-op) ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function srng(tag){
  const f=mulberry(hashStr(G.seed+'|'+tag));
  return {f,rnd:(a,b)=>a+f()*(b-a),ri:(a,b)=>Math.floor(a+f()*(b-a+1)),pick:a=>a[Math.floor(f()*a.length)]};
}

/* ---------- tiles ---------- */
// 0 floor, 1 wall, 2 crate, 3 exit door, 4 entry door, 5 spikes, 6 ore
function blankGrid(){
  const g=[];
  for(let r=0;r<ROWS;r++)g.push(new Array(COLS).fill(0));
  for(let c=0;c<COLS;c++){g[0][c]=1;g[ROWS-1][c]=1;}
  for(let r=0;r<ROWS;r++){g[r][0]=1;g[r][COLS-1]=1;}
  g[5][0]=g[6][0]=4;g[5][COLS-1]=g[6][COLS-1]=3;
  return g;
}
function place(g,c,r,w,h,v){
  for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){
    const cc=c+dx,rr=r+dy;
    if(cc<1||rr<1||cc>COLS-2||rr>ROWS-2)continue;
    if(rr>=4&&rr<=7&&(cc<=3||cc>=16))continue;
    if(g[rr][cc]===0)g[rr][cc]=v;
  }
}
function bfs(g){
  const seen=new Set([5*COLS+1]),q=[[1,5]];
  while(q.length){
    const [c,r]=q.pop();
    for(const [dx,dy] of D4){
      const nc=c+dx,nr=r+dy;
      if(nc<1||nr<1||nc>COLS-2||nr>ROWS-2||g[nr][nc]!==0)continue;
      const k=nr*COLS+nc;if(seen.has(k))continue;
      seen.add(k);q.push([nc,nr]);
    }
  }
  return seen;
}
function genLayout(type,R){
  const open=['boss','treasure','shop','altar','challenge'];
  if(open.includes(type)){
    const g=blankGrid();
    if(type==='boss'){for(const [c,r] of [[6,3],[6,8],[13,3],[13,8]])place(g,c,r,1,1,1);}
    else if(type==='challenge'){for(const [c,r] of [[6,5],[13,5],[9,2],[10,9]])place(g,c,r,1,1,1);}
    return {grid:g,reach:bfs(g)};
  }
  for(let tries=0;tries<30;tries++){
    const g=blankGrid();
    if(type==='mine'){
      const n=R.ri(16,24);
      for(let i=0;i<n;i++)place(g,R.ri(4,15),R.ri(1,10),1,1,6);
    }else{
      const n=R.ri(3,type==='trap'?5:7);
      for(let i=0;i<n;i++){
        const wall=R.f()<.5,c=R.ri(4,9),r=R.ri(2,9),w=wall?R.ri(1,2):1,h=R.ri(1,2),v=wall?1:2;
        place(g,c,r,w,h,v);
        if(R.f()<.8)place(g,COLS-c-w,r,w,h,v);
        if(R.f()<.5)place(g,c,ROWS-r-h,w,h,v);
      }
    }
    const reach=bfs(g);
    if(reach.has(5*COLS+18)&&reach.has(6*COLS+18)){
      if(type==='trap'){
        const tiles=[...reach].filter(k=>{const c=k%COLS;return c>=4&&c<=16;});
        const n=Math.min(tiles.length,R.ri(12,18));
        for(let i=0;i<n;i++){const k=tiles.splice(Math.floor(R.f()*tiles.length),1)[0];g[Math.floor(k/COLS)][k%COLS]=5;}
      }
      return {grid:g,reach};
    }
  }
  const g=blankGrid();return {grid:g,reach:bfs(g)};
}
function tv(c,r){return(c<0||r<0||c>=COLS||r>=ROWS)?1:G.grid[r][c];}
function solidV(v){return v===1||v===2||v===4||v===6||(v===3&&!G.doorOpen);}
function tileSolid(c,r){return solidV(tv(c,r));}
function blocked(x,y,r,fly){
  const c0=Math.floor((x-r)/T),c1=Math.floor((x+r)/T),r0=Math.floor((y-r)/T),r1=Math.floor((y+r)/T);
  for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){
    const v=tv(cc,rr);
    if(fly){if(v===1||v===4||(v===3&&!G.doorOpen))return true;}
    else if(solidV(v))return true;
  }
  return false;
}
function moveEnt(e,dx,dy,fly){
  const r=e.cr||e.r;
  if(e.ghost){e.x=clamp(e.x+dx,14,W-14);e.y=clamp(e.y+dy,T+10,H-T-10);return;}
  if(!blocked(e.x+dx,e.y,r,fly))e.x+=dx;
  if(!blocked(e.x,e.y+dy,r,fly))e.y+=dy;
}

function addText(x,y,s,col,sc){G.texts.push({x,y,s,col:col||'#fff',t:.8,sc:sc||1});}
function parts(x,y,n,col,spd,life,size){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(.3,1)*spd;
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:life*rnd(.6,1),m:life,col,s:size||3});}
}
function depthF(){return G.floor-1+G.roomI/Math.max(1,G.rooms.length);}
function relN(id){return G.rel[id]||0;}
function upg(id){return G.upg[id]||0;}
function luck(){return upg('luck')*.12+relN('luck')*.3+(G.roomLuck||0)+(G.gear?G.gear.luck||0:0)+(G.pas?G.pas.luck:0)+(G.bless==='luck'?.15:0);}
function wpickW(a){let s=0;for(const x of a)s+=x[1];let r=Math.random()*s;for(const x of a){r-=x[1];if(r<=0)return x[0];}return a[0][0];}

/* ---------- loot rolls ---------- */
function matTier(mult){
  const d=G.floor-1+(G.roomI||0)*.1,L=1+luck()+(mult||0);
  const w=[100,(6+d*3)*L,Math.max(0,d-.5)*3.2*L,Math.max(0,d-3.5)*1.8*L,Math.max(0,d-7.5)*.9*L];
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<5;i++){r-=w[i];if(r<=0)return i;}
  return 0;
}
function rollQuality(bonus){
  const d=G.floor-1,L=1+luck()+(bonus||0);
  const w=[60,(24+d)*L,(8+d*2.2)*L,Math.max(0,d-1.5)*1.7*L,Math.max(0,d-5.5)*.8*L];
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<5;i++){r-=w[i];if(r<=0)return i+1;}
  return 1;
}
function rollWeaponId(bonus){
  const f=G.floor,base=[[6,3,.7,0],[3,4,2,.4],[1,3,4,1.2],[1,2.5,4,2]][Math.min(3,f-1)].slice();
  if(bonus){base[0]*=.35;base[2]*=1.5;base[3]*=1.5;}
  let x=Math.random()*base.reduce((a,b)=>a+b,0),t=0;
  for(;t<3;t++){x-=base[t];if(x<=0)break;}
  const held=G.player?G.player.w.filter(Boolean).map(w=>w.id):[];
  const pool=BYTIER[t+1].filter(id=>!held.includes(id));
  return pick(pool.length?pool:BYTIER[t+1]);
}
function mkWeapon(id,q){
  q=q||1;const base=WEAPONS[id],d=Object.assign({},base),aff=[];

  const name=aff.map(a=>a.n).join('')+base.n;

}

function genRooms(f){
  const R=srng('S'+f),n=Math.min(8,5+Math.floor((f-1)/2)+R.ri(0,1)),types=['battle'],cnt={};
  const WT=[['battle',40],['elite',14],['treasure',10],['shop',12],['altar',8],['trap',12],['ambush',10],['mine',7],['challenge',8],['smith',6],['gamble',6]];
  const uniq=['treasure','shop','altar','mine','smith','gamble'];
  while(types.length<n-1){
    const pool=WT.filter(([t])=>!(uniq.includes(t)&&cnt[t])&&!(t!=='battle'&&types[types.length-1]===t)&&!(f===1&&(t==='elite'||t==='challenge')&&types.length<2));
    let r=R.f()*pool.reduce((a,x)=>a+x[1],0),ch=pool[0][0];
    for(const [t,w] of pool){r-=w;if(r<=0){ch=t;break;}}
    types.push(ch);cnt[ch]=(cnt[ch]||0)+1;
  }
  if(!cnt.shop&&!cnt.treasure)types[Math.min(2,types.length-1)]=R.f()<.5?'shop':'treasure';
  types.push('boss');
  return types;
}

function applyFx(e,fx,dmg){

function addBolt(x1,y1,x2,y2,col,th){

function chainFrom(e,dmg,hops,range){

  }else if(t.kind==='fountain'){

  }else if(t.kind==='altar'){
    const a=t.ref;

/* ---------- enemies ---------- */
function tickDmg(e,d,col){
  e.hp-=d;e.flash=Math.max(e.flash,.05);
  addText(e.x+rnd(-6,6),e.y-e.r-8,String(Math.max(1,Math.round(d))),col,.85);
  if(e.hp<=0)killEnemy(e);
}
function statusTick(e,dt){
  if(e.burn){
    e.burn.t-=dt;e.tk=(e.tk||0)+dt;
    if(Math.random()<dt*14)G.parts.push({x:e.x+rnd(-6,6),y:e.y+rnd(-4,4),vx:0,vy:-40,t:.3,m:.3,col:'#ff9a4a',s:3});
    if(e.tk>=.5){e.tk=0;tickDmg(e,e.burn.dps*.5,'#ff9a4a');}
    if(e.burn&&e.burn.t<=0)e.burn=null;
  }
  if(e.poison){
    e.poison.t-=dt;e.tp=(e.tp||0)+dt;
    if(e.tp>=.5){e.tp=0;tickDmg(e,e.poison.dps*.5,'#9be05a');}
    if(e.poison&&e.poison.t<=0)e.poison=null;
  }
  if(e.slow>0)e.slow-=dt;
  if(e.elite&&e.elite.includes('regen')&&e.hp<e.maxhp)e.hp=Math.min(e.maxhp,e.hp+e.maxhp*.04*dt);
}
function updEnemy(e,dt){
  if(e.flash>0)e.flash-=dt;
  if(e.orbCd>0)e.orbCd-=dt;
  statusTick(e,dt);if(e.dead)return;
  if(e.kx||e.ky){
    moveEnt(e,e.kx*dt,e.ky*dt,e.d.fly);
    const f=Math.pow(.02,dt);e.kx*=f;e.ky*=f;
    if(Math.abs(e.kx)<5)e.kx=0;if(Math.abs(e.ky)<5)e.ky=0;
  }
  if(e.freeze>0){e.freeze-=dt;return;}
  if(G.stopT>0)return;
  const p=G.player,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  const sl=(e.slow>0?.5:1)*(G.slowT>0?.35:1),sp=e.d.spd*e.spdM*sl,fr=sl;
  e.t+=dt;
  if(e.elite&&e.elite.includes('volley')&&e.d.ai!=='shoot'&&e.d.ai!=='tank'&&e.d.ai!=='mage'){
    e.volT=(e.volT===undefined?rnd(1,3):e.volT)-dt*fr;
    if(e.volT<=0){e.volT=3;for(let i=0;i<6;i++)eFire(e.x,e.y,i*TAU/6+e.t,150,1,'#ffb347');}
  }
  switch(e.d.ai){
    case 'chase':moveEnt(e,ux*sp*dt,uy*sp*dt);break;
    case 'shoot':{
      const want=d>240?1:d<150?-1:0,sx=-uy*e.dir,sy=ux*e.dir;
      moveEnt(e,(ux*want*.8+sx*.5)*sp*dt,(uy*want*.8+sy*.5)*sp*dt);
      if(Math.random()<dt*.3)e.dir*=-1;
      e.fireT-=dt*fr*(e.elite&&e.elite.includes('volley')?1.8:1);
      if(e.fireT<=0&&d<430){e.fireT=e.d.fire*rnd(.85,1.15);eFire(e.x,e.y,Math.atan2(dy,dx),e.d.bs,e.cdmg||1,'#c9f06a');sfx(250,.08,'square',.02,-60);}
      break;}
    case 'spider':{
      const want=d>200?1:d<120?-1:0,sx=-uy*e.dir,sy=ux*e.dir;
      moveEnt(e,(ux*want*.5+sx*.9)*sp*dt,(uy*want*.5+sy*.9)*sp*dt);
      if(Math.random()<dt*.6)e.dir*=-1;
      e.fireT-=dt*fr;
      if(e.fireT<=0&&d<420){
        e.fireT=e.d.fire*rnd(.85,1.15);const a=Math.atan2(dy,dx);
        for(let i=-1;i<=1;i++)eFire(e.x,e.y,a+i*.18,e.d.bs,1,'#a6e05a');
        sfx(300,.08,'square',.02,-60);
      }
      break;}
    case 'bat':{
      e.phase+=dt*4*fr;const a=Math.atan2(dy,dx)+Math.sin(e.phase)*.9;
      moveEnt(e,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt,true);break;}
    case 'ghost':{
      e.phase+=dt*2;const a=Math.atan2(dy,dx)+Math.sin(e.phase)*.5;
      moveEnt(e,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt,true);break;}
    case 'bomber':
      if(e.fuse>0){
        e.fuse-=dt;
        if(e.fuse<=0){e.dead=true;G.kills++;explode(e.x,e.y,66,0,2,false);}
      }else{moveEnt(e,ux*sp*dt,uy*sp*dt);if(d<46)e.fuse=.6;}
      break;
    case 'tank':
      if(d>150)moveEnt(e,ux*sp*dt,uy*sp*dt);
      e.fireT-=dt*fr;
      if(e.fireT<=0&&d<420){
        e.fireT=e.d.fire;const a=Math.atan2(dy,dx);
        for(let i=-1;i<=1;i++)eFire(e.x,e.y,a+i*.22,e.d.bs,1,'#ffd166',5);
        sfx(180,.12,'square',.03,-60);
      }
      break;
    case 'mage':{
      const want=d>230?1:d<170?-1:0;
      moveEnt(e,ux*want*sp*dt,uy*want*sp*dt);
      e.fireT-=dt*fr;
      if(e.fireT<=0){
        e.fireT=e.d.fire;e.ang+=.4;
        for(let i=0;i<8;i++)eFire(e.x,e.y,e.ang+i*TAU/8,e.d.bs,1,'#ff8be6');
        sfx(330,.15,'triangle',.03,150);
      }
      break;}
    case 'golem':{
      if(e.chg){
        const c=e.chg;
        if(c.w>0)c.w-=dt*fr;
        else{moveEnt(e,c.vx*dt*fr,c.vy*dt*fr);c.t-=dt*fr;if(c.t<=0)e.chg=null;}
      }else{
        moveEnt(e,ux*sp*dt,uy*sp*dt);
        e.fireT-=dt*fr;
        if(e.fireT<=0&&d<320){e.fireT=rnd(3.2,4.4);e.chg={w:.6,t:.55,vx:ux*330,vy:uy*330};}
      }
      break;}
    case 'summon':{
      const want=d>250?1:d<190?-1:0;
      moveEnt(e,ux*want*sp*dt,uy*want*sp*dt);
      e.summonT-=dt*fr;
      if(e.summonT<=0){
        e.summonT=5;
        if(G.enemies.length+G.spawners.length<(G.roomType==='boss'?5:10))for(let i=0;i<2;i++)spawnAt(Math.random()<.5?'slime':'skeleton',clamp(e.x+rnd(-50,50),T+16,W-T-16),clamp(e.y+rnd(-50,50),T+16,H-T-16));
        G.rings.push({x:e.x,y:e.y,r:40,t:.3,max:.3,col:'#6bd6ff'});
      }
      break;}
  }
  for(const a of G.allies){if(a.kind==='soldier'&&Math.hypot(a.x-e.x,a.y-e.y)<e.r+a.r+2){e.ac=(e.ac||0)-dt;if(e.ac<=0){e.ac=.6;a.hp-=Math.max(2,(e.cdmg||1)*3);parts2(a.x,a.y,4,'#b58cff',90,.3,2,'c',0,true);}}}
  if(e.cdmg&&e.d.contact&&d<e.r+p.r){
    hurt(e.cdmg);
    if(e.elite&&e.elite.includes('vamp'))e.hp=Math.min(e.maxhp,e.hp+e.maxhp*.1);
  }
}
function bossAttack(e){
  const p=G.player,f=G.floor,p2=e.p2,a0=Math.atan2(p.y-e.y,p.x-e.x);
  const opts=['ring','fan','charge','summon'];
  if(f>=2)opts.push('spiral','spiral');
  if(f>=4)opts.push('rain');
  let o=pick(opts);if(o==='summon'&&(e.sums>=3||G.enemies.length+G.spawners.length>3))o='ring';if(o==='summon')e.sums=(e.sums||0)+1;const col=e.d.col,bs=150+Math.min(f,10)*12,dm=e.cdmg;
  if(o==='ring'){
    const n=12+Math.min(f,8)*3+(p2?6:0),off=rnd(0,TAU);
    for(let i=0;i<n;i++)eFire(e.x,e.y,off+i*TAU/n,bs,dm,col,5);
    sfx(200,.25,'sawtooth',.05,-80);
  }else if(o==='fan'){
    const vol=2+(p2?1:0)+(f>=5?1:0);
    for(let v=0;v<vol;v++)G.timers.push({t:v*.35,fn:()=>{
      if(e.dead||G.state!=='play')return;
      const a=Math.atan2(G.player.y-e.y,G.player.x-e.x);
      for(let i=-2;i<=2;i++)eFire(e.x,e.y,a+i*.2,bs+30,dm,col,5);
      sfx(260,.1,'square',.04,-100);
    }});
  }else if(o==='spiral'){
    const n=22+(p2?12:0),off=rnd(0,TAU);
    for(let i=0;i<n;i++)G.timers.push({t:i*.07,fn:()=>{
      if(e.dead||G.state!=='play')return;
      eFire(e.x,e.y,off+i*.5,bs,dm,col,5);
      if(f>=3)eFire(e.x,e.y,off+i*.5+Math.PI,bs,dm,col,5);
    }});
  }else if(o==='rain'){
    const n=14+(p2?8:0);
    for(let i=0;i<n;i++)G.timers.push({t:i*.12,fn:()=>{
      if(e.dead||G.state!=='play')return;
      eFire(rnd(T+10,W-T-10),T+8,Math.PI/2,bs+20,dm,col,5);
    }});
    sfx(150,.4,'sawtooth',.05,60);
  }else if(o==='charge'){
    e.charge={w:.7,t:.6,vx:Math.cos(a0)*400,vy:Math.sin(a0)*400};
    sfx(120,.5,'sawtooth',.05,100);
  }else{
    const n=Math.min(2+Math.min(f,3),Math.max(1,5-G.enemies.length-G.spawners.length)),pool=poolFor(f).filter(t=>!['bomber','golem','tank','summoner','splitter','mage'].includes(t));
    for(let i=0;i<n;i++){
      const a=rnd(0,TAU),x=clamp(e.x+Math.cos(a)*80,70,W-70),y=clamp(e.y+Math.sin(a)*80,70,H-70);
      spawnAt(pick(pool),x,y);
    }
  }
}
function updBoss(e,dt){
  if(e.flash>0)e.flash-=dt;
  statusTick(e,dt);if(e.dead)return;
  if(e.freeze>0){e.freeze-=dt;return;}
  if(G.stopT>0)return;
  const p=G.player,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,sl=(e.slow>0?.7:1)*(G.slowT>0?.4:1);
  e.t+=dt;
  if(!e.p2&&e.hp<e.maxhp*.5){
    e.p2=true;G.banner={text:'守關王暴怒了',sub:'',t:1.6,col:'#ff6b6b'};
    const n=20;for(let i=0;i<n;i++)eFire(e.x,e.y,i*TAU/n,160,e.cdmg,e.d.col,5);
    G.shake=10;sfx(90,.5,'sawtooth',.07,-30);
  }
  if(e.charge){
    const c=e.charge;
    if(c.w>0){c.w-=dt*sl;}
    else{
      const ox=e.x,oy=e.y;moveEnt(e,c.vx*dt*sl,c.vy*dt*sl);c.t-=dt*sl;
      if(Math.hypot(e.x-ox,e.y-oy)<Math.hypot(c.vx,c.vy)*dt*sl*.3){c.t=0;G.shake=Math.max(G.shake,8);}
      if(c.t<=0){e.charge=null;e.cd=1;}
    }
  }else{
    if(d>190)moveEnt(e,dx/d*e.d.spd*dt*.6*sl,dy/d*e.d.spd*dt*.6*sl);
    e.cd-=dt*sl;
    if(e.cd<=0){bossAttack(e);e.cd=(e.p2?1.5:2.2)*Math.max(.6,1-.03*G.floor)+rnd(0,.6);}
  }
  if(d<e.r+p.r)hurt(e.cdmg);
}
function sepEnemies(){
  const a=G.enemies;
  for(let i=0;i<a.length;i++){
    const e=a[i];if(e.dead||e.d.fly||e.isBoss)continue;
    for(let j=i+1;j<a.length;j++){
      const o=a[j];if(o.dead||o.d.fly||o.isBoss)continue;
      const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy),m=e.r+o.r;
      if(d>0&&d<m){const k=(m-d)/2/d;moveEnt(e,-dx*k,-dy*k);moveEnt(o,dx*k,dy*k);}
    }
  }
}

/* ---------- v3: helpers, effects, scenery ---------- */
function theme(){return G.floorSpecial||THEMES[G.tperm[(G.floor-1)%THEMES.length]];}
function pk(id){return G&&G.perk?(G.perk[id]||0):0;}
function mix(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t),g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t),bl=Math.round((pa&255)*(1-t)+(pb&255)*t);
  return 'rgb('+r+','+g+','+bl+')';
}
function fxAdd(k,x,y,m,o){const f=Object.assign({k,x,y,t:m,m},o||{});G.fx.push(f);return f;}
function flashScreen(col,t){G.flashC=col;G.flashT=t;G.flashM=t;}
function parts2(x,y,n,col,spd,life,size,kind,g,add){
  if(!SET.fx)n=Math.ceil(n/2);
  for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(.3,1)*spd;
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:life*rnd(.6,1),m:life,col,s:size||3,k:kind||'',g:g||0,add:!!add});}
}
function pb(x,y,a,spd,r,dmg,life,col,o){
  return Object.assign({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r,dmg,crit:false,life,pierce:0,col,homing:false,explode:0,beam:false,
    fx:null,leech:0,boom:false,bt:0,ret:false,sp:spd,hit:[],src:'p',bounce:0},o||{});
}

/* ambient scenery particles */
function updAmb(dt){
  const th=theme(),A=G.amb;
  if(A.length<48&&Math.random()<dt*7){
    const d=th.deco,o={x:rnd(T,W-T),y:rnd(T,H-T),vx:0,vy:0,t:rnd(3,6),m:5,s:2,col:'#fff',k:'c',ph:rnd(0,6)};
    if(d==='snow'){o.y=T;o.vy=rnd(25,45);o.vx=rnd(-12,12);o.s=2.2;o.col='#eaf6ff';}
    else if(d==='ember'){o.y=H-T;o.vy=-rnd(25,55);o.vx=rnd(-10,10);o.col='#ff9a4a';o.s=2.5;o.add=true;}
    else if(d==='firefly'){o.vx=rnd(-12,12);o.vy=rnd(-12,12);o.col='#d6ff8a';o.s=2.5;o.add=true;o.blink=true;}
    else if(d==='mist'){o.vx=rnd(6,14);o.s=rnd(26,44);o.col='rgba(210,200,240,.05)';o.t=o.m=rnd(5,8);o.k='soft';}
    else if(d==='dust'){o.vx=rnd(14,32);o.vy=rnd(-4,4);o.col='rgba(230,200,140,.5)';}
    else if(d==='star'){o.col='#ffd6ff';o.add=true;o.blink=true;o.k='s';o.s=3;}
    else if(d==='petal'){o.y=T;o.vy=rnd(18,32);o.vx=rnd(-18,-4);o.col='#ffb3d1';o.s=3;o.sway=true;}
    else if(d==='bubble'||d==='toxic'){o.y=H-T;o.vy=-rnd(14,30);o.col=d==='toxic'?'rgba(155,224,90,.55)':'rgba(160,230,255,.5)';o.k='ring';o.s=rnd(2,4);}
    else if(d==='spark'){o.col='#ffd166';o.add=true;o.t=o.m=rnd(.4,.9);o.vx=rnd(-40,40);o.vy=rnd(-40,40);o.k='l';o.s=2;}
    else if(d==='mote'){o.vx=rnd(-10,10);o.vy=rnd(-10,10);o.col='#fff6a8';o.add=true;o.blink=true;o.s=2;}
    else if(d==='sparkle'){o.col='#ffe9a0';o.add=true;o.blink=true;o.k='s';o.s=3.5;o.t=o.m=rnd(1,2);}
    A.push(o);
  }
  for(const o of A){o.t-=dt;o.ph+=dt*2;o.x+=o.vx*dt+(o.sway?Math.sin(o.ph)*10*dt:0);o.y+=o.vy*dt;}
  G.amb=A.filter(o=>o.t>0&&o.x>-20&&o.x<W+20&&o.y>-20&&o.y<H+20);
}
function drawAmb(){
  for(const o of G.amb){
    let al=clamp(Math.min(o.t,o.m-o.t+.01)/.8,0,1);
    if(o.blink)al*=.5+.5*Math.sin(o.ph*3);
    ctx.globalAlpha=al;ctx.fillStyle=o.col;ctx.strokeStyle=o.col;
    if(o.add)ctx.globalCompositeOperation='lighter';
    if(o.k==='soft'){ctx.beginPath();ctx.arc(o.x,o.y,o.s,0,TAU);ctx.fill();}
    else if(o.k==='ring'){ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(o.x,o.y,o.s,0,TAU);ctx.stroke();}
    else if(o.k==='l'){ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x-o.vx*.05,o.y-o.vy*.05);ctx.stroke();}
    else if(o.k==='s'){drawStar(o.x,o.y,o.s);}
    else{ctx.beginPath();ctx.arc(o.x,o.y,o.s,0,TAU);ctx.fill();}
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=1;
}
function drawStar(x,y,s){
  ctx.beginPath();ctx.moveTo(x,y-s*1.6);ctx.lineTo(x+s*.4,y-s*.4);ctx.lineTo(x+s*1.6,y);ctx.lineTo(x+s*.4,y+s*.4);
  ctx.lineTo(x,y+s*1.6);ctx.lineTo(x-s*.4,y+s*.4);ctx.lineTo(x-s*1.6,y);ctx.lineTo(x-s*.4,y-s*.4);ctx.closePath();ctx.fill();
}
function drawParts(){
  for(const q of G.parts){
    ctx.globalAlpha=clamp(q.t/q.m,0,1);ctx.fillStyle=q.col;ctx.strokeStyle=q.col;
    if(q.add)ctx.globalCompositeOperation='lighter';
    if(q.k==='c'){ctx.beginPath();ctx.arc(q.x,q.y,q.s/2,0,TAU);ctx.fill();}
    else if(q.k==='l'){ctx.lineWidth=Math.max(1,q.s*.5);ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.05,q.y-q.vy*.05);ctx.stroke();}
    else if(q.k==='s')drawStar(q.x,q.y,q.s*.5);
    else ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);
    if(q.add)ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=1;
}

/* floor / wall patterns */
function floorDeco(th,c,r,x,y){
  const h=(c*7+r*13+c*r)%7;
  ctx.lineWidth=1;
  if(extraFloor(th,c,r,x,y,h))return;
  switch(th.pat){
    case 'tile':if(h===0){ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(x+10,y+14,5,3);ctx.fillRect(x+24,y+26,3,3);}break;
    case 'plank':ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x,y+T/2,T,1);if(h<3)ctx.fillRect(x+8+h*9,y,1,T/2);break;
    case 'lava':if(h<2){ctx.fillStyle='rgba(255,120,40,.35)';ctx.fillRect(x+6,y+12+h*8,24,2);ctx.fillRect(x+16,y+8,2,18);}break;

    case 'fire':for(let i=-1;i<=1;i++){ctx.fillStyle=i?'#ff7a45':'#ffd166';const f=Math.sin(t*12+i)*2;ctx.beginPath();ctx.moveTo(x+i*6-3,y-r+2);ctx.lineTo(x+i*6,y-r-9+f);ctx.lineTo(x+i*6+3,y-r+2);ctx.fill();}break;
    case 'moss':ctx.fillStyle='#3f8a4a';ctx.fillRect(x-r*.7,y-r+1,r*.9,3);ctx.fillRect(x+2,y-r+2,4,3);ctx.fillStyle='#8be08a';ctx.fillRect(x+r*.3,y-r-1,2,2);break;
    case 'bone':ctx.strokeStyle='#f0ead8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-5,y-r+1);ctx.quadraticCurveTo(x-10,y-r-8,x-4,y-r-9);ctx.moveTo(x+5,y-r+1);ctx.quadraticCurveTo(x+10,y-r-8,x+4,y-r-9);ctx.stroke();break;
    case 'sand':ctx.fillStyle='#d8b85a';ctx.fillRect(x-r,y-r*.2,r*2,3);ctx.fillStyle='#8a6a2a';ctx.fillRect(x-r,y-r*.2+3,r*2,1);break;
    case 'void':ctx.fillStyle='#d6c4ff';ctx.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const a=t*3+i*TAU/3;ctx.beginPath();ctx.arc(x+Math.cos(a)*(r+6),y+Math.sin(a)*(r+6)*.6,2,0,TAU);ctx.fill();}break;
    case 'petal':ctx.fillStyle='#ffc2dc';ctx.beginPath();ctx.ellipse(x+r*.5,y-r,4,2.5,.6,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(x+r*.5+4,y-r+2,3,2,-.4,0,TAU);ctx.fill();break;
    case 'fin':ctx.fillStyle='#2fa0b0';ctx.beginPath();ctx.moveTo(x-4,y-r+2);ctx.lineTo(x,y-r-10);ctx.lineTo(x+5,y-r+2);ctx.fill();break;
    case 'gear':ctx.strokeStyle='#e6e9f0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+r*.55,y-r*.7,4,0,TAU);ctx.stroke();for(let i=0;i<6;i++){const a=t*2+i*TAU/6;ctx.fillRect(x+r*.55+Math.cos(a)*5-1,y-r*.7+Math.sin(a)*5-1,2,2);}break;
    case 'bolt':ctx.fillStyle='#fff27a';ctx.globalCompositeOperation='lighter';ctx.beginPath();ctx.moveTo(x+1,y-r-10);ctx.lineTo(x-3,y-r-3);ctx.lineTo(x,y-r-3);ctx.lineTo(x-2,y-r+3);ctx.lineTo(x+4,y-r-5);ctx.lineTo(x+1,y-r-5);ctx.closePath();ctx.fill();break;
    case 'toxic':ctx.fillStyle='#b6ff6a';ctx.fillRect(x-r*.5,y+r*.4,2,4+Math.sin(t*5)*2);ctx.fillRect(x+r*.3,y+r*.5,2,3+Math.cos(t*5)*2);break;

/* ---------- fx drawing ---------- */
function drawSigil(x,y,r,col,rot,al){
  ctx.save();ctx.translate(x,y);ctx.scale(1,.55);ctx.globalAlpha=al;ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.82,0,TAU);ctx.stroke();
  ctx.rotate(rot);
  for(let k=0;k<2;k++){ctx.beginPath();for(let i=0;i<3;i++){const a=i*TAU/3+k*Math.PI/3-Math.PI/2;const px=Math.cos(a)*r*.82,py=Math.sin(a)*r*.82;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.stroke();}
  for(let i=0;i<8;i++){const a=i*TAU/8;ctx.save();ctx.translate(Math.cos(a)*r*.91,Math.sin(a)*r*.91);ctx.rotate(a);ctx.fillRect(-2,-3,4,6);ctx.restore();}
  ctx.restore();
}
function drawFxLow(){
  for(const f of G.fx){
    const k=f.t/f.m;
    if(f.k==='sigil')drawSigil(f.x,f.y,f.r*(f.grow?1-k*.3:1),f.col,G.t*1.5,Math.min(1,k*2.2)*Math.min(1,(1-k)*8+.2));
    else if(f.k==='warn'){
      ctx.globalAlpha=.25+.2*Math.sin(G.t*20);ctx.fillStyle='#ff5d3a';ctx.beginPath();ctx.ellipse(f.x,f.y,f.r,f.r*.6,0,0,TAU);ctx.fill();
      ctx.globalAlpha=.8;ctx.strokeStyle='#ff9a6b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r*(1-k),f.r*(1-k)*.6,0,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }
  }
  if(G.zone){
    const z=G.zone;drawSigil(z.x,z.y,z.r,'#c58bff',G.t*.8,.55);
    ctx.globalAlpha=.08;ctx.fillStyle='#c58bff';ctx.beginPath();ctx.ellipse(z.x,z.y,z.r,z.r*.55,0,0,TAU);ctx.fill();ctx.globalAlpha=1;
  }
}
function drawFxHigh(){
  for(const f of G.fx){
    const k=f.t/f.m;
    ctx.save();
    if(f.k==='beam'){
      const env=Math.sin(Math.PI*(1-k)),hw=f.w*.5*env;
      ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.globalCompositeOperation='lighter';
      const lg=ctx.createLinearGradient(0,-hw,0,hw);lg.addColorStop(0,'rgba(0,0,0,0)');lg.addColorStop(.3,f.col);lg.addColorStop(.5,f.col2||'#fff');lg.addColorStop(.7,f.col);lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg;ctx.fillRect(0,-hw,f.len,hw*2);
      ctx.fillStyle=f.col2||'#fff';ctx.globalAlpha=.8;ctx.fillRect(0,-hw*.18,f.len,hw*.36);
      ctx.beginPath();ctx.arc(0,0,hw*1.2,0,TAU);ctx.globalAlpha=.7;ctx.fill();
    }else if(f.k==='charge'){
      const rr=6+(1-k)*24;ctx.globalCompositeOperation='lighter';
      const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,rr*1.6);rg.addColorStop(0,'#fff');rg.addColorStop(.4,f.col);rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,rr*1.6,0,TAU);ctx.fill();
      ctx.strokeStyle=f.col;ctx.lineWidth=2;
      for(let i=0;i<6;i++){const a=i*TAU/6+G.t*6,d=70*k+8;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*d,f.y+Math.sin(a)*d);ctx.lineTo(f.x+Math.cos(a)*(d-14),f.y+Math.sin(a)*(d-14));ctx.stroke();}
    }else if(f.k==='shock'){
      ctx.globalCompositeOperation='lighter';ctx.strokeStyle=f.col;
      for(let i=0;i<3;i++){const kk=clamp((1-k)*1.15-i*.12,0,1);if(kk<=0)continue;ctx.globalAlpha=(1-kk)*.9;ctx.lineWidth=(f.th||5)*(1-kk)+1;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r*kk,f.r*kk*.62,0,0,TAU);ctx.stroke();}
    }else if(f.k==='pillar'){
      const env=Math.sin(Math.PI*(1-k)),w=(f.w||30)*env;ctx.globalCompositeOperation='lighter';
      const lg=ctx.createLinearGradient(f.x-w,0,f.x+w,0);lg.addColorStop(0,'rgba(0,0,0,0)');lg.addColorStop(.5,f.col);lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg;ctx.fillRect(f.x-w,Math.max(0,f.y-(f.h||360)),w*2,f.h||360);
      ctx.fillStyle='#fff';ctx.globalAlpha=.8;ctx.fillRect(f.x-w*.2,Math.max(0,f.y-(f.h||360)),w*.4,f.h||360);
    }else if(f.k==='slashx'){
      ctx.globalCompositeOperation='lighter';ctx.strokeStyle=f.col;ctx.globalAlpha=k;ctx.lineWidth=5*k+1;
      const s=f.r*(1.1-k*.3);ctx.beginPath();ctx.moveTo(f.x-s,f.y-s*.6);ctx.lineTo(f.x+s,f.y+s*.6);ctx.moveTo(f.x-s,f.y+s*.6);ctx.lineTo(f.x+s,f.y-s*.6);ctx.stroke();
    }else if(f.k==='rope'){
      ctx.globalCompositeOperation='lighter';ctx.strokeStyle=f.col;ctx.globalAlpha=k;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x2,f.y2,3,0,TAU);ctx.fill();
    }else if(f.k==='bigslash'){
      ctx.globalCompositeOperation='lighter';ctx.strokeStyle=f.col;ctx.globalAlpha=k;ctx.lineWidth=12*k+2;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*.8,f.a-1.6,f.a+1.6);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r*.8,f.a-1.5,f.a+1.5);ctx.stroke();
    }
    ctx.restore();
  }
}

/* ---------- per-frame extras ---------- */
function playerExtras(dt){
  const p=G.player;
  p.scale+=((p.giantT>0?1.6:1)-p.scale)*Math.min(1,dt*6);
  p.r=10*(1+(p.scale-1)*.6);
  const base=G.ch.id==='hunter'?.8:1.3;
  p.dashMax=1+pk('dash');
  if(p.dashN<p.dashMax){p.dashR-=dt;if(p.dashR<=0){p.dashN++;p.dashR=base;}}
  else p.dashR=base;
  if(G.ch.id==='monk')p.energy=Math.min(p.maxenergy,p.energy+3*dt);
  if(G.ch.id==='strategist')p.energy=Math.min(p.maxenergy,p.energy+2*dt);
  if(p.dash||p.dashGhost>0){
    p.dashGhost=(p.dashGhost||0)-dt;
    G.tt=(G.tt||0)-dt;
    if(G.tt<=0){G.tt=.03;G.trail.push({x:p.x,y:p.y,aim:p.aim,face:p.face,wid:p.w[p.cur].id,t:.22,m:.22,sc:p.scale});}
  }
  const AU={knight:['#ffd166','s'],rogue:['#ff6b9a','c'],mage:['#c9a7ff','s'],shade:['#b58cff','c'],ooze:['#6ee7b7','c'],tinker:['#ffe08a','l'],hunter:['#e8e0c8','c'],pirate:['#ffcf8a','s'],monk:['#9be7ff','s'],giant:['#ff9a6b','c']};
  const au=AU[G.ch.id];
  if(au&&Math.random()<dt*(p.dualT>0||p.rage>0||p.giantT>0?18:4)){
    const o={x:p.x+rnd(-8,8),y:p.y+rnd(-4,10),vx:rnd(-10,10),vy:-rnd(15,45),t:.7,m:.7,col:au[0],s:au[1]==='s'?3:2.5,k:au[1],g:0,add:true};
    if(G.ch.id==='shade'){o.s=4;o.col='rgba(120,80,200,.6)';o.t=o.m=1;o.add=false;}
    G.parts.push(o);
  }
}

/* ---------- in-run perks ---------- */
function offerPerk(){
  if(!G||G.perkChoice||G.state!=='play')return;
  const pool=PERKS.filter(q=>(G.perk[q.id]||0)<q.max&&(!q.only||q.only===G.ch.id));
  const ch=[];
  while(ch.length<3&&pool.length)ch.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  if(!ch.length)return;
  G.perkChoice=ch;
  showOv('選擇一項強化',coarse?'點擊選擇':'按 1 / 2 / 3 或點擊選擇',ch.map((q,i)=>({
    label:(i+1)+'. '+q.n+'　'+q.d+((G.perk[q.id]||0)?'（升到 Lv'+(G.perk[q.id]+1)+'）':''),main:i===0,fn:()=>choosePerk(i)})));
}
function choosePerk(i){
  if(!G||!G.perkChoice)return;
  const q=G.perkChoice[i];if(!q)return;
  G.perk[q.id]=(G.perk[q.id]||0)+1;G.perkChoice=null;hideOv();
  const p=G.player;

function doDash(){

  if(p.down||p.dash||p.dashN<=0)return;
  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touch.mx,my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touch.my;

  p.dashN--;if(p.dashR<=0)p.dashR=G.ch.id==='hunter'?.8:1.3;

/* ---------- update ---------- */
function spikePh(c,r){return (G.t+((c*3+r*5)%7)*.3)%3.2;}
function updPlayer(dt){
  const p=G.player;
  for(const k of ['fireT','inv','dmgBuff','dualT','rage','comboT','giantT','pdCd'])if(p[k]>0)p[k]=Math.max(0,p[k]-dt);
  if(p.shieldT>0){p.shieldT-=dt;if(p.shieldT<=0)p.shield=0;}
  if(p.orbitT>0)p.orbitT-=dt;
  for(const s of G.sk)if(s.cd>0)s.cd=Math.max(0,s.cd-dt);
  G.noEnT-=dt;
  stats();playerExtras(dt);
  if(p.swing){p.swing.t-=dt;if(p.swing.t<=0)p.swing=null;}
  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touch.mx;
  let my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touch.my;
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(p.dash){
    moveEnt(p,p.dash.vx*dt,p.dash.vy*dt);p.dash.t-=dt;
    parts(p.x,p.y,1,'#ff9bb8',30,.3,4);
    if(p.dash.t<=0)p.dash=null;
  }else{
    const sp=G.ch.speed*p.st.spd*(p.giantT>0?.8:1),kk=Math.min(1,dt*(ml>.05?14:18));
    p.vx+=(mx*sp-p.vx)*kk;p.vy+=(my*sp-p.vy)*kk;
    const vv=Math.hypot(p.vx,p.vy);
    if(vv>4){moveEnt(p,p.vx*dt,p.vy*dt);p.walk+=dt*Math.min(1.5,vv/Math.max(1,sp));}
  }
  p.still=(ml<.05&&!p.dash)?(p.still||0)+dt:0;
  let tgt=null;
  if(G.auto)tgt=nearestEnemy(p.x,p.y,430);
  if(tgt)p.aim=Math.atan2(tgt.y-p.y,tgt.x-p.x);
  else if(!G.auto)p.aim=Math.atan2(mouse.y-p.y,mouse.x-p.x);
  else if(ml>.2)p.aim=Math.atan2(my,mx);
  p.face=Math.cos(p.aim)>=0?1:-1;
  if((mouse.down||keys.j||keys.k||touch.fire)&&!p.dash)fireWeapon();
  p.armorT+=dt;
  if(p.armorT>3&&p.armor<p.maxarmor&&!G.mod.noreg){p.armorReg+=dt;if(p.armorReg>1.1){p.armor++;p.armorReg=0;}}
  const c=Math.floor(p.x/T),r=Math.floor(p.y/T);
  if(tv(c,r)===5&&spikePh(c,r)>=2.4)hurt(1);
}
function updDown(dt){

  }else if(G.downT<=0||netAliveInRoom()===0){p.down=false;endRun(false);}

function updBullets(dt){
  const p=G.player;
  for(const b of G.bullets){
    const sp=b.boom?b.sp:Math.hypot(b.vx,b.vy),steps=Math.max(1,Math.ceil(sp*dt/8)),sdt=dt/steps;
    for(let s=0;s<steps&&!b.dead;s++){
      if(b.homing){
        const best=nearestEnemy(b.x,b.y,260);
        if(best){
          const cur=Math.atan2(b.vy,b.vx);let da=Math.atan2(best.y-b.y,best.x-b.x)-cur;
          da=Math.atan2(Math.sin(da),Math.cos(da));
          const na=cur+clamp(da,-5*sdt,5*sdt);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
        }
      }
      if(b.boom){
        b.bt+=sdt;
        if(!b.ret&&b.bt>.4){b.ret=true;b.hit=[];}
        if(b.ret){
          const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;
          b.vx=dx/d*sp*1.15;b.vy=dy/d*sp*1.15;
          if(d<14){b.dead=true;break;}
        }
      }
      b.x+=b.vx*sdt;b.y+=b.vy*sdt;
      const c=Math.floor(b.x/T),r=Math.floor(b.y/T),v=tv(c,r);
      if(solidV(v)){
        if(b.boom&&!b.ret){b.ret=true;b.hit=[];b.x-=b.vx*sdt;b.y-=b.vy*sdt;continue;}
        if(b.bounce>0&&!b.explode){if(v===2||v===6)hitCrate(c,r,b.dmg);const px=b.x-b.vx*sdt,py=b.y-b.vy*sdt;if(solidV(tv(c,Math.floor(py/T))))b.vx=-b.vx;else if(solidV(tv(Math.floor(px/T),r)))b.vy=-b.vy;else{b.vx=-b.vx;b.vy=-b.vy;}b.x=px;b.y=py;b.bounce--;parts2(b.x,b.y,3,b.col,80,.2,2,'l',0,true);continue;}
        if(v===2||v===6)hitCrate(c,r,b.dmg);
        if(b.explode)explode(b.x,b.y,b.explode,b.dmg,0,true);
        else parts(b.x,b.y,3,b.col,70,.2,2);
        b.dead=true;break;
      }
      for(const e of G.enemies){
        if(e.dead||b.hit.includes(e.id))continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
          if(b.explode){explode(b.x,b.y,b.explode,b.dmg,0,true);if(b.fx)applyFx(e,b.fx,b.dmg);b.dead=true;break;}
          dmgEnemy(e,b.dmg,Math.atan2(b.vy,b.vx),b.crit,b.fx,b.leech);
          if(b.pierce>0){b.pierce--;b.hit.push(e.id);}
          else if(b.boom){b.hit.push(e.id);}
          else{b.dead=true;break;}
        }
      }
    }
    b.life-=dt;
    if(b.life<=0&&!b.dead){if(b.explode)explode(b.x,b.y,b.explode,b.dmg,0,true);b.dead=true;}
  }
  G.bullets=G.bullets.filter(b=>!b.dead);
  const k=(G.slowT>0?.35:1)*(G.stopT>0?0:1);
  for(const b of G.eb){
    b.x+=b.vx*dt*k;b.y+=b.vy*dt*k;b.life-=dt;
    const v=tv(Math.floor(b.x/T),Math.floor(b.y/T));
    if(b.life<=0||solidV(v)){b.dead=true;continue;}
    if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r-1){hurt(b.dmg);b.dead=true;}
    else for(const a of G.allies)if(a.kind==='soldier'&&Math.hypot(a.x-b.x,a.y-b.y)<b.r+a.r){a.hp-=b.dmg*3;b.dead=true;parts2(a.x,a.y,4,'#b58cff',90,.3,2,'c',0,true);break;}
  }
  G.eb=G.eb.filter(b=>!b.dead);
}
function updPickups(dt){

  }
}

function updVortex(dt){

function update(dt){
  if(G.hitStop>0){G.hitStop-=dt;return;}
  G.t+=dt;
  const p=G.player;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  if(G.flash>0)G.flash-=dt;
  if(G.slowT>0)G.slowT-=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  for(const t of G.timers)t.t-=dt;
  const due=G.timers.filter(t=>t.t<=0);G.timers=G.timers.filter(t=>t.t>0);
  for(const t of due)t.fn();
  if(G.state==='play'){if(p.down)updDown(dt);else updPlayer(dt);}
  for(const s of G.spawners){
    s.t-=dt;
    if(s.t<=0){
      s.done=true;
      G.enemies.push(s.opt&&s.opt.boss?makeBoss(s.x,s.y):makeEnemy(s.type,s.x,s.y,s.opt));
      parts(s.x,s.y,8,'#fff',90,.4,3);

  }

  for(const e of G.enemies){if(!e.dead){if(e.isBoss)updBoss(e,dt);else updEnemy(e,dt);}}

  for(const a of G.allies)updAlly(a,dt);
  G.allies=G.allies.filter(a=>a.life>0&&!(a.kind==='soldier'&&a.hp<=0));
  updOrbit(dt);updVortex(dt);updExtras(dt);updPets(dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  updBullets(dt);
  updPickups(dt);
  for(const s of G.swings)s.t-=dt;G.swings=G.swings.filter(s=>s.t>0);
  for(const r of G.rings)r.t-=dt;G.rings=G.rings.filter(r=>r.t>0);
  for(const b of G.bolts)b.t-=dt;G.bolts=G.bolts.filter(b=>b.t>0);
  for(const q of G.parts){q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.g||0)*dt;q.vx*=.92;q.vy*=.92;}
  G.parts=G.parts.filter(q=>q.t>0);
  {const cap=SET.fx?320:130;if(G.parts.length>cap)G.parts.splice(0,G.parts.length-cap);}
  for(const t of G.texts){t.t-=dt;t.y-=28*dt;}
  G.texts=G.texts.filter(t=>t.t>0);
  netTick(dt);
  if(G.state!=='play')return;
  if(G.chal&&G.locked){
    if(G.waveDelay>0)G.waveDelay-=dt;
    else{
      G.chal.t-=dt;G.chal.spawnT-=dt;
      if(G.chal.spawnT<=0&&G.enemies.length+G.spawners.length<12){
        G.chal.spawnT=Math.max(1.1,2.6-depthF()*.08);
        for(let i=0;i<2;i++){const pos=randSpawnPos();if(pos)spawnAt(pickType(),pos[0],pos[1],Math.random()<.1&&G.floor>1?eliteOpt(1):null);}
      }

        G.spawners.length=0;G.eb.length=0;clearRoom();
      }
    }
  }else if(G.locked&&G.enemies.length===0&&G.spawners.length===0&&G.timers.length===0){
    if(G.waveDelay>0){G.waveDelay-=dt;if(G.waveDelay<=0)spawnWave();}
    else if(G.wave<G.waves)G.waveDelay=.8;

  }
  if(G.portal){
    G.portal.t+=dt;
  }
  if(G.doorOpen&&p.x>W-16&&G.roomI<G.rooms.length-1&&!G.portal&&!p.down){G.roomI++;enterRoom();}
}

function promptText(pr){
  const k=coarse?'點「互動」':'按 E';
  {const ex=promptExtra(pr,k);if(ex)return ex;}
  if(pr.kind==='pick'){
    const q=pr.ref,pc=q.price?'（'+q.price+' 金幣）':'';
    if(q.type==='weapon'){const w=q.inst.d;return k+(q.price?' 購買 ':' 拾取 ')+QN[q.inst.q-1]+'・'+q.inst.name+'　傷害 '+w.dmg.toFixed(1)+(w.cost?'　能量 '+w.cost:'　免能量')+pc;}
    if(q.type==='relic'){const d=relicDef(q.rid);return k+' 取得 '+d.n+'：'+d.d+pc;}
    if(q.type==='potion')return k+' 飲用：回復 3 生命與護甲'+pc;
    return k+' 補滿能量'+pc;
  }
  if(pr.kind==='chest')return k+' 開啟寶箱'+(pr.ref.ambush?'（可能有埋伏）':'');

}
function render(){
  ctx.clearRect(0,0,W,H);
  if(!G)return;
  const th=theme();G.themeCrate=th.crate;
  ctx.save();
  if(G.shake>0)ctx.translate(rnd(-G.shake,G.shake)*.5,rnd(-G.shake,G.shake)*.5);
  drawRoom(th);drawAmb();drawFxLow();drawProps();drawPickups();drawEffects();
  const list=G.enemies.slice().sort((a,b)=>a.y-b.y),p=G.player;
  let drawnP=false;
  const dp=()=>{
    drawnP=true;
    if(p.down){
      ctx.globalAlpha=.55;ctx.save();ctx.translate(p.x,p.y+6);ctx.rotate(1.4);drawPlayer(ctx,0,0,G.ch,0,1,0,p.w[p.cur].id,0,1);ctx.restore();ctx.globalAlpha=1;
      ctx.strokeStyle='#6ee7b7';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,22,-Math.PI/2,-Math.PI/2+TAU*clamp(G.reviveT/2.5,0,1));ctx.stroke();
      ctx.font='13px '+FONT;ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.fillText('倒地 '+Math.ceil(G.downT)+'s',p.x,p.y-26);
      return;
    }
    if(G.state==='over')return;
    if(p.inv>0&&Math.floor(G.t*20)%2===0&&!p.dash)return;
    const sw=p.swing?(-1.1*p.swing.dir+2.2*p.swing.dir*(1-p.swing.t/.18)):0;
    if(p.dualT>0){ctx.strokeStyle='rgba(255,200,87,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,16,0,TAU);ctx.stroke();}
    if(p.dmgBuff>0||p.rage>0){ctx.strokeStyle='rgba(255,107,154,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,18,0,TAU);ctx.stroke();}
    const inst=p.w[p.cur];
    drawPlayer(ctx,p.x,p.y,G.ch,p.aim,p.face,p.walk,inst.id,sw,p.scale,QC[inst.q-1]);
  };
  drawTrail();
  const all=list.map(e=>({y:e.y,f:()=>drawEnemy(e)}));
  for(const a of G.allies)all.push({y:a.y,f:()=>drawAlly(a)});
  for(const q of G.pets)all.push({y:q.y,f:()=>drawPetIn(q)});
  all.sort((a,b)=>a.y-b.y);
  for(const o of all){if(!drawnP&&o.y>p.y)dp();o.f();}
  if(!drawnP)dp();
  netDrawGhosts();drawCaptureHints();
  drawTop();drawBullets();drawFxHigh();
  drawParts();
  ctx.textAlign='center';
  for(const t of G.texts){ctx.globalAlpha=clamp(t.t/.4,0,1);ctx.font=(13*t.sc)+'px '+FONT;ctx.fillStyle='#000';ctx.fillText(t.s,t.x+1,t.y+1);ctx.fillStyle=t.col;ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
  if(G.prompt){
    const s=promptText(G.prompt);
    ctx.font='14px '+FONT;ctx.fillStyle='rgba(0,0,0,.75)';const tw=ctx.measureText(s).width+16;
    const bx=clamp(p.x,tw/2+4,W-tw/2-4);ctx.fillRect(bx-tw/2,p.y-60,tw,20);ctx.fillStyle='#ffc857';ctx.fillText(s,bx,p.y-45);
  }
  ctx.restore();
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(G.flash>0){ctx.fillStyle='rgba(255,60,80,'+(G.flash/.25*.28)+')';ctx.fillRect(0,0,W,H);}
  if(G.slowT>0){ctx.fillStyle='rgba(120,90,200,.12)';ctx.fillRect(0,0,W,H);}
  drawTrailAndStop();
  drawHUD();
}

let netDb=null,netRoomNs=null,netUid=null,netJoined=null,lbRows=[],lbOk=false,saveT=null,pubT=0,ghosts={};
function loadLocal(){
  try{
    const s=JSON.parse(localStorage.getItem('mjd_save2')||'null');
    if(s)save=Object.assign(SAVE0(),s);
  }catch(e){}
}
function persist(){
  save.ts=Date.now();
  try{localStorage.setItem('mjd_save2',JSON.stringify(save));}catch(e){}
  if(netDb&&netUid){
    clearTimeout(saveT);
    saveT=setTimeout(async()=>{
      try{await netDb.doc('data/users/'+netUid+'/save').set(JSON.parse(JSON.stringify(save)));}catch(e){}
    },1200);
  }
}
async function netInit(){
  const c=window.claude;
  if(!c||!c.use)return;
  try{netDb=await c.use('db');}catch(e){}
  let user=null;
  try{user=await c.use('user');}catch(e){}
  if(user&&user.id){try{netUid=await user.id();}catch(e){}}
  if(netDb&&netUid){
    try{
      const snap=await netDb.doc('data/users/'+netUid+'/save').get();
      if(snap.exists){
        const d=snap.data();
        if(d&&(d.ts||0)>(save.ts||0)){
          save=Object.assign(SAVE0(),d);
          try{localStorage.setItem('mjd_save2',JSON.stringify(save));}catch(e){}
          if(!menuEl.classList.contains('hidden'))renderHub();
        }
      }else persist();
    }catch(e){}
    try{
      netDb.collection('leaderboard').orderBy('score','desc').limit(20).onSnapshot(s=>{
        lbRows=s.docs.map(d=>d.data());lbOk=true;
        if(!menuEl.classList.contains('hidden')&&tab==='lb')renderHub();
      },()=>{});
    }catch(e){}
  }
  try{netRoomNs=await c.use('room');}catch(e){}
  const st=$('netst');if(st)st.textContent=netStatusText();
}
function netStatusText(){
  if(!window.claude)return '單機模式';
  return (netRoomNs?'連線：可用':'連線：尚未啟用')+(netUid&&netDb?'　雲端存檔：開':'　存檔：本機');
}
function netBoardList(){return lbRows;}
function netBoardOk(){return lbOk;}
async function netBoard(score){
  if(!netDb||!netUid||!G)return;
  const rec={name:(save.name||'勇者').slice(0,10),score,floor:G.floor,kills:G.kills,ch:G.ch.id,ts:Date.now()};
  try{if(score>=save.bestScore)await netDb.doc('leaderboard/'+netUid).set(rec);}catch(e){}
}
async function netJoin(code){
  if(!netRoomNs)return;
  const name='mjd-'+String(code).toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24);
  try{
    const r=await netRoomNs.join(name);
    if(!G||!G.co){try{r.leave();}catch(e){}return;}
    netJoined=r;ghosts={};
    try{r.on('chat',m=>{if(m&&!m.isMe&&m.data)gameChatIn(m.data);});}catch(e){}
  }catch(e){netJoined=null;}
}
function netLeave(){
  if(netJoined){try{netJoined.leave();}catch(e){}netJoined=null;}
  ghosts={};
}
function others(){
  if(!netJoined)return [];
  try{return netJoined.peers().filter(q=>!q.isMe&&q.kind==='viewer'&&q.presence&&q.presence.f!==undefined);}catch(e){return [];}
}
function myPeer(){
  try{const m=netJoined&&netJoined.peers().find(q=>q.isMe&&q.sameTab);return m?m.peer:null;}catch(e){return null;}
}
function sameRoom(q){return !!G&&q.presence.f===G.floor&&q.presence.r===G.roomI;}
function netAliveInRoom(){return others().filter(q=>sameRoom(q)&&!q.presence.d).length;}
function netBeingRevived(){
  const me=myPeer();
  return !!me&&others().some(q=>sameRoom(q)&&!q.presence.d&&q.presence.rv===me);
}
function netTeamList(){
  return others().map(q=>({n:String(q.presence.n||'勇者'),f:Number(q.presence.f)||1,r:(Number(q.presence.r)||0)+1,
    hp:Math.ceil(Number(q.presence.hp)||0),mh:Number(q.presence.mh)||0,down:!!q.presence.d,same:sameRoom(q)}));
}
function netTick(dt){
  if(!netJoined||!G||!G.co)return;
  pubT-=dt;if(pubT>0)return;pubT=.1;
  const p=G.player;let rv=null;
  if(!p.down){
    for(const q of others()){
      if(sameRoom(q)&&q.presence.d&&Math.hypot((Number(q.presence.x)||0)-p.x,(Number(q.presence.y)||0)-p.y)<40){rv=q.peer;break;}
    }
  }
  netJoined.presence({n:(save.name||'勇者').slice(0,10),x:Math.round(p.x),y:Math.round(p.y),a:Math.round(p.aim*100)/100,
    hp:p.hp,mh:p.maxhp,ch:G.ch.id,w:p.w[p.cur].id,f:G.floor,r:G.roomI,d:p.down?1:0,rv:rv}).catch(()=>{});
}
function netDrawGhosts(){
  if(!G||!netJoined)return;
  const seen={};
  for(const q of others()){
    if(!sameRoom(q))continue;
    const pr=q.presence;seen[q.peer]=1;
    const tx=clamp(Number(pr.x)||60,0,W),ty=clamp(Number(pr.y)||240,0,H),a=Number(pr.a)||0;
    let g=ghosts[q.peer];if(!g)g=ghosts[q.peer]={x:tx,y:ty};
    g.x+=(tx-g.x)*.35;g.y+=(ty-g.y)*.35;
    const ch=CHARS.find(c=>c.id===pr.ch)||CHARS[0],wid=WEAPONS[pr.w]?pr.w:'pistol';
    ctx.globalAlpha=pr.d?.45:.85;
    if(pr.d){ctx.save();ctx.translate(g.x,g.y+6);ctx.rotate(1.4);drawPlayer(ctx,0,0,ch,0,1,0,wid,0,1);ctx.restore();}
    else drawPlayer(ctx,g.x,g.y,ch,a,Math.cos(a)>=0?1:-1,0,wid,0,1);
    ctx.globalAlpha=1;
    ctx.font='12px '+FONT;ctx.textAlign='center';ctx.fillStyle=pr.d?'#ff6b6b':'#6ee7b7';
    ctx.fillText(String(pr.n||'勇者').slice(0,10)+(pr.d?'（倒地，靠近救援）':''),g.x,g.y-30);
  }
  for(const k in ghosts)if(!seen[k])delete ghosts[k];
}

function uid2(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function mkGear(slot,q){
  const n=[1,2,2,3,4][q-1],pool=GPREF[slot].slice(),stats={};
  for(let i=0;i<n&&pool.length;i++){
    const k=pool.splice(Math.floor(Math.random()*Math.min(pool.length,i<2?3:pool.length)),1)[0],d=GSTAT[k];
    const v=(d[1]+d[2]*(q-1))*rnd(.85,1.15);
    stats[k]=d[3]?Math.round(v*1000)/1000:Math.max(1,Math.round(v));
  }
  const it={uid:uid2(),slot,q,lv:0,stats,name:(GQP[q-1]?GQP[q-1]+'・':'')+pick(GBASE[slot])};
  if(q>=4)it.trait={id:pick(GTRAIT),lv:q>=5?2:1};
  if(Math.random()<.3){const s=pick(SETS);it.set=s.id;it.name=s.n+'・'+it.name;}
  return it;
}
function gv(it,k){const v=it.stats[k]*(1+.1*it.lv);return GSTAT[k][3]?v:Math.round(v);}
function gearSell(it){return Math.floor(GSELL[it.q-1]*(1+.3*it.lv));}

  for(const [s] of GSLOTS){const it=eqGear(s);if(!it)continue;for(const k in it.stats)o[k]+=gv(it,k);}
  const cn=setCounts();
  for(const id in cn){const S=SETS.find(q=>q.id===id);if(cn[id]>=2)for(const k in S.b2)o[k]+=S.b2[k];}
  return o;
}

  const pr=save.daily.prog;pr.kills+=G.kills;pr.elite+=G.eliteKills||0;pr.boss+=G.bossKills||0;pr.cap+=G.caught.length;pr.skill+=G.skillUses||0;pr.cry=Math.max(pr.cry,gain);pr.floor=Math.max(pr.floor,G.floor);pr.run+=1;

  for(const p of G.caught)addPet(p);
  for(const it of G.loot)addGear(it);
  if(G.bless&&save.bless)save.bless.used=true;
  let t='';
  if(G.mod&&modBonus()>0)t+='　挑戰加成 +'+Math.round(modBonus()*100)+'%';
  if(G.caught.length)t+='　捕捉 '+G.caught.map(p=>PETS[p.sp].n).join('、');
  if(G.loot.length)t+='　裝備 '+G.loot.length+' 件';
  if(xp&&eqPets().length)t+='　寵物經驗 +'+xp;
  persist();
  return {gain,text:t};
}

/* ---------- v4: in-run pets, capture, gear drops ---------- */
function applyLoadout(){
  G.gear=gearSums();
  G.pas={armor:0,luck:0,mag:0,spd:0,cdr:0,heal:0,energy:0,armorReg:0};
  G.pets=[];
  const p=G.player;
  const eq=eqPets(),combo=eq.length===2?(PETS[eq[0].sp].kind===PETS[eq[1].sp].kind?1.12:1.05):1;
  eq.forEach((inst,i)=>{
    const d=PETS[inst.sp],m=petMult(inst)*combo;
    G.pets.push({inst,def:d,m,x:p.x-20-i*12,y:p.y+8,fireT:rnd(0,1),hit:0,t:rnd(0,6),face:1,r:6});
    if(d.kind==='pas'){
      const k=d.pas;
      if(k==='armor'){G.pas.armor+=Math.max(1,Math.round(m));G.pas.armorReg+=.6*m;}
      else if(k==='luck')G.pas.luck+=.12*m;
      else if(k==='mag')G.pas.mag+=.6*m;
      else if(k==='heal'){const iv=30/m;G.pas.heal=G.pas.heal?Math.min(G.pas.heal,iv):iv;}
      else if(k==='energy')G.pas.energy+=2.5*m;
      else if(k==='cdr')G.pas.cdr+=.06*m;
      else if(k==='spd')G.pas.spd+=.05*m;
    }
  });
  {const cn=setCounts();for(const id in cn)if(cn[id]>=4){const S=SETS.find(q=>q.id===id);G.perk[S.b4.perk]=(G.perk[S.b4.perk]||0)+1;}}
  for(const [s] of GSLOTS){const it=eqGear(s);if(it&&it.trait)G.perk[it.trait.id]=(G.perk[it.trait.id]||0)+it.trait.lv;}
}
function updPets(dt){
  const p=G.player;
  if(G.pas.energy)p.energy=Math.min(p.maxenergy,p.energy+G.pas.energy*dt);
  if(G.pas.armorReg&&p.armorT>3&&p.armor<p.maxarmor&&!G.mod.noreg)p.armorReg+=dt*G.pas.armorReg;
  if(G.pas.heal){
    G.healT=(G.healT===undefined?G.pas.heal:G.healT)-dt;
    if(G.healT<=0){G.healT=G.pas.heal;if(p.hp<p.maxhp&&!p.down){p.hp++;addText(p.x,p.y-28,'+1','#8be08a');parts2(p.x,p.y,6,'#8be08a',60,.6,3,'s',-40,true);}}
  }
  G.pets.forEach((q,i)=>{
    q.t+=dt;q.hit-=dt;q.fireT-=dt;
    const d=q.def,dmg=(d.dmg||0)*q.m*p.st.dmg;
    let tx=p.x-p.face*22-i*10,ty=p.y+(i?16:-4),spd=130;
    const e=d.kind==='atk'?nearestEnemy(q.x,q.y,d.atk==='melee'?280:340):null;
    if(e&&d.atk==='melee'){
      const dx=e.x-q.x,dy=e.y-q.y,dd=Math.hypot(dx,dy)||1;
      moveEnt(q,dx/dd*210*dt,dy/dd*210*dt);q.face=dx>=0?1:-1;
      if(dd<e.r+q.r+6&&q.hit<=0){q.hit=d.rate;dmgEnemy(e,dmg,Math.atan2(dy,dx));parts2(e.x,e.y,5,d.col,120,.3,2,'l',0,true);}
    }else{
      if(e){q.face=e.x>=q.x?1:-1;}
      const dx=tx-q.x,dy=ty-q.y,dd=Math.hypot(dx,dy);
      if(dd>60)spd=Math.min(300,130+dd);
      if(dd>3){const k=Math.min(dd,spd*dt)/dd;moveEnt(q,dx*k,dy*k);}
      if(!e&&dd<30)q.face=p.face;
      if(e&&q.fireT<=0){
        const a=Math.atan2(e.y-q.y,e.x-q.x);q.fireT=d.rate;
        if(d.atk==='shot')G.bullets.push(pb(q.x,q.y,a,480,4,dmg,.9,d.col,{src:'a',fx:d.fx||null}));
        else if(d.atk==='chain'){addBolt(q.x,q.y,e.x,e.y,d.col,2);dmgEnemy(e,dmg);chainFrom(e,dmg*.5,q.inst.st,120);}
        parts2(q.x,q.y,3,d.col,80,.2,2,'c',0,true);
      }
    }
    if(Math.hypot(q.x-p.x,q.y-p.y)>260){q.x=p.x;q.y=p.y;}
    q.x=clamp(q.x,T+6,W-T-6);q.y=clamp(q.y,T+6,H-T-6);
  });
}
function drawPetIn(q){drawPet(ctx,q.x,q.y,q.inst.sp,q.inst.st,G.t+q.t,q.face,1,q.inst.q);}
function drawPet(g,x,y,sp,st,t,face,sc,q){
  const d=PETS[sp],c=d.col,s=(.85+.18*st)*(sc||1),bob=Math.sin(t*6)*1.5;
  g.save();g.translate(x,y);g.scale(s*(face<0?-1:1),s);
  if(q>=3){g.globalCompositeOperation='lighter';g.fillStyle=q>=4?'rgba(255,200,87,.25)':'rgba(197,139,255,.22)';g.beginPath();g.arc(0,0,15,0,TAU);g.fill();g.globalCompositeOperation='source-over';}
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,8,8,3,0,0,TAU);g.fill();
  const eye=(ex,ey)=>{g.fillStyle='#fff';g.fillRect(ex,ey+bob,3,3);g.fillStyle='#12141c';g.fillRect(ex+1,ey+1+bob,2,2);};
  g.fillStyle=c;
  switch(d.shape){
    case 'blob':g.beginPath();g.ellipse(0,3+bob*.5,8,6.5,0,Math.PI,TAU);g.fill();g.fillRect(-8,3+bob*.5,16,3);eye(-4,-1);eye(1,-1);break;
    case 'fox':case 'cat':case 'dog':{
      g.beginPath();g.ellipse(-1,3+bob*.4,8,5,0,0,TAU);g.fill();
      g.beginPath();g.arc(5,-2+bob*.4,5,0,TAU);g.fill();
      g.beginPath();g.moveTo(2,-6+bob*.4);g.lineTo(3,-11+bob*.4);g.lineTo(6,-6+bob*.4);g.fill();g.beginPath();g.moveTo(6,-6+bob*.4);g.lineTo(9,-10+bob*.4);g.lineTo(9,-5+bob*.4);g.fill();
      if(d.shape==='dog'){g.fillStyle='#d8d0b8';g.fillRect(8,-1+bob*.4,4,3);g.fillStyle=c;}
      g.beginPath();g.moveTo(-8,3);g.quadraticCurveTo(-14,-4+Math.sin(t*8)*3,-10,-7);g.lineTo(-8,-4);g.fill();
      if(sp==='fox'){g.fillStyle='#ffd166';g.beginPath();g.arc(-11,-6+Math.sin(t*8)*2,2.5,0,TAU);g.fill();}
      eye(5,-4);break;}
    case 'bird':g.beginPath();g.ellipse(0,1+bob*.5,6,6,0,0,TAU);g.fill();g.beginPath();g.moveTo(-3,0);g.lineTo(-12,-5+Math.sin(t*14)*5);g.lineTo(-4,4);g.fill();g.fillStyle='#ff9a4a';g.beginPath();g.moveTo(5,0);g.lineTo(10,2);g.lineTo(5,3);g.fill();eye(2,-4);break;
    case 'wisp':g.globalCompositeOperation='lighter';g.beginPath();g.moveTo(0,-9+bob);g.lineTo(6,0+bob);g.lineTo(0,9+bob);g.lineTo(-6,0+bob);g.closePath();g.fill();g.fillStyle='#fff';g.fillRect(-1,-3+bob,2,4);g.globalCompositeOperation='source-over';break;
    case 'turtle':g.beginPath();g.ellipse(0,2,9,6,0,Math.PI,TAU);g.fill();g.fillStyle='#6a7a9a';g.fillRect(-9,2,18,3);g.fillStyle=c;g.beginPath();g.arc(9,3,3.5,0,TAU);g.fill();eye(8,1);break;
    case 'bat':g.beginPath();g.arc(0,0+bob,4.5,0,TAU);g.fill();g.beginPath();g.moveTo(-3,0);g.lineTo(-13,-5+Math.sin(t*16)*4);g.lineTo(-7,4);g.fill();g.beginPath();g.moveTo(3,0);g.lineTo(13,-5+Math.sin(t*16)*4);g.lineTo(7,4);g.fill();g.fillStyle='#ff5d6c';g.fillRect(-3,-2+bob,2,2);g.fillRect(1,-2+bob,2,2);break;
    case 'flower':g.fillStyle='#4a9a4a';g.fillRect(-1,0,2,8);for(let i=0;i<5;i++){const a=i*TAU/5+t;g.fillStyle=c;g.beginPath();g.arc(Math.cos(a)*5,-4+Math.sin(a)*5+bob*.5,3,0,TAU);g.fill();}g.fillStyle='#ffd166';g.beginPath();g.arc(0,-4+bob*.5,2.5,0,TAU);g.fill();break;
    case 'jelly':g.globalAlpha=.85;g.beginPath();g.arc(0,-1+bob,7,Math.PI,TAU);g.fill();for(let i=-1;i<=1;i++)g.fillRect(i*4-1,-1+bob,2,6+Math.sin(t*6+i)*2);g.globalAlpha=1;eye(-4,-4);eye(1,-4);break;
    case 'owl':g.beginPath();g.ellipse(0,1+bob*.4,6,7,0,0,TAU);g.fill();g.beginPath();g.moveTo(-5,-5);g.lineTo(-4,-10);g.lineTo(-1,-6);g.fill();g.beginPath();g.moveTo(5,-5);g.lineTo(4,-10);g.lineTo(1,-6);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-2.5,-2+bob*.4,2.5,0,TAU);g.arc(2.5,-2+bob*.4,2.5,0,TAU);g.fill();g.fillStyle='#12141c';g.fillRect(-3,-2+bob*.4,1.5,2);g.fillRect(2,-2+bob*.4,1.5,2);break;
  }
  if(st>=2){g.globalCompositeOperation='lighter';g.fillStyle='#fff';drawStarIn(g,6,-12+Math.sin(t*3)*1.5,2);g.globalCompositeOperation='source-over';}
  if(st>=3){g.strokeStyle='#ffd166';g.lineWidth=1.5;g.beginPath();g.arc(0,-1,13+Math.sin(t*4),0,TAU);g.stroke();}
  g.restore();
}
function drawStarIn(g,x,y,s){g.beginPath();g.moveTo(x,y-s*1.6);g.lineTo(x+s*.4,y-s*.4);g.lineTo(x+s*1.6,y);g.lineTo(x+s*.4,y+s*.4);g.lineTo(x,y+s*1.6);g.lineTo(x-s*.4,y+s*.4);g.lineTo(x-s*1.6,y);g.lineTo(x-s*.4,y-s*.4);g.closePath();g.fill();}

/* capture */
function capturable(e){return !e.dead&&!e.isBoss&&e.hp<=e.maxhp*(e.elite?.25:.35);}
function tryCapture(){
  if(!G||G.state!=='play'||G.player.down)return;
  const p=G.player;
  if(G.orbs<=0){addText(p.x,p.y-28,'沒有捕捉球','#ff5d6c');sfx(120,.1,'square',.04);return;}
  let best=null,bd=150;
  for(const e of G.enemies)if(capturable(e)){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<bd){bd=d;best=e;}}
  if(!best){addText(p.x,p.y-28,'附近沒有虛弱的怪物','#e9ecf5');return;}
  G.orbs--;
  const ch=clamp((.55+(1-best.hp/best.maxhp)*.3)*(best.elite?.75:1)*(1+luck()*.3),.1,.92);
  fxAdd('rope',p.x,p.y,.35,{x2:best.x,y2:best.y,col:'#ffd166'});sfx(600,.15,'triangle',.05,300);
  if(Math.random()<ch){
    best.dead=true;
    let q=best.elite?2:1;
    if(Math.random()<.08+luck()*.1)q++;
    if(G.floor>=10&&Math.random()<.2)q++;
    const inst=mkPet(ENEMY_PET[best.type]||'slimey',Math.min(4,q));
    G.caught.push(inst);
    fxAdd('sigil',best.x,best.y,.9,{r:36,col:'#ffd166'});parts2(best.x,best.y,18,'#ffd166',160,.7,3,'s',-40,true);
    addText(best.x,best.y-20,'捕捉成功！','#ffd166',1.3);
    G.banner={text:'捕捉 '+PETS[inst.sp].n,sub:PQN[inst.q]+'　結算時加入寵物欄',t:2.2,col:'#ffd166'};
    sfx(900,.3,'triangle',.06,500);
  }else{
    addText(best.x,best.y-20,'捕捉失敗','#ff9a6b',1.1);parts2(best.x,best.y,8,'#ff9a6b',100,.4,3,'c',0,true);sfx(160,.2,'sawtooth',.05,-60);
  }
}
function drawCaptureHints(){
  if(!G.orbs)return;
  for(const e of G.enemies){
    if(!capturable(e))continue;
    const pul=.6+.4*Math.sin(G.t*8);
    ctx.save();ctx.globalAlpha=pul;ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y-e.r-8,5,0,TAU);ctx.stroke();
    ctx.fillStyle='#ffd166';ctx.fillRect(e.x-4,e.y-e.r-9,8,2);ctx.restore();

}

function weaponUpCost(){const w=G.player.w[G.player.cur];return Math.round((50*w.q+20)*(1+.1*depthF()));}
function gambleCost(){return Math.round(25*(1+.15*depthF()));}
function promptExtra(pr,k){
  const r=pr.ref;
  if(pr.kind==='portal')return k+' 進入傳送門，前往下一層';
  if(pr.kind==='angel')return k+' 接受天使祝福：回復 2 生命並選擇一項強化（免費）';
  if(pr.kind==='devil')return G.player.maxhp<=3?'生命太低，惡魔不願交易':k+' 惡魔交易：最大生命 -2，獲得兩次強化與傷害 +15%';
  if(pr.kind==='smith'){const w=G.player.w[G.player.cur];return w.q>=5?'目前武器已是最高品質':k+' 進化「'+w.name+'」→ '+QN[w.q]+'品質（'+weaponUpCost()+' 金幣）';}
  if(pr.kind==='gamble')return k+' 押注 '+gambleCost()+' 金幣（剩 '+(3-r.n)+' 次）';
  return null;
}
function interactExtra(t){
  const p=G.player,r=t.ref;
  if(t.kind==='portal'){nextFloor();return true;}
  if(t.kind==='angel'||t.kind==='devil'){
    if(t.kind==='devil'&&p.maxhp<=3){sfx(120,.1,'square',.04);return true;}
    for(const o of G.props)if(o.kind==='angel'||o.kind==='devil')o.used=true;

/* ---------- chat ---------- */
let hubRoom=null,hubJoining=false,hubChat=[],hubUnsub=[],dmTo='';
function cleanText(s){return String(s||'').replace(/[\u0000-\u001f]/g,' ').slice(0,60);}
function myPresence(){return {n:(save.name||'勇者').slice(0,10),fc:save.fc,sel:save.sel};}
async function hubJoin(){
  if(hubRoom||hubJoining||!netRoomNs)return;
  hubJoining=true;
  try{
    const r=await netRoomNs.join('mjd-lobby');
    if(tab!=='friends'||!menuEl||menuEl.classList.contains('hidden')){try{r.leave();}catch(e){}hubJoining=false;return;}
    hubRoom=r;
    hubUnsub.push(r.on('chat',m=>{if(m&&!m.isMe&&m.data)hubPush({from:cleanText(m.data.n).slice(0,10)||'勇者',fc:cleanText(m.data.fc),text:cleanText(m.data.t)});}));
    hubUnsub.push(r.on('dm',m=>{
      if(!m||m.isMe||!m.data||m.data.to!==save.fc)return;
      hubPush({from:cleanText(m.data.n).slice(0,10)||'勇者',fc:cleanText(m.data.fc),text:cleanText(m.data.t),dm:true,inv:cleanText(m.data.inv)});
    }));
    hubUnsub.push(r.onPeers(()=>{if(tab==='friends')refreshFriends();}));
    await r.presence(myPresence());
  }catch(e){hubRoom=null;}
  hubJoining=false;if(tab==='friends')refreshFriends();
}
function hubLeave(){
  for(const u of hubUnsub){try{u();}catch(e){}}hubUnsub=[];
  if(hubRoom){try{hubRoom.leave();}catch(e){}hubRoom=null;}
}
function hubPeers(){
  if(!hubRoom)return [];
  try{return hubRoom.peers().filter(q=>!q.isMe&&q.presence&&q.presence.fc).map(q=>({fc:cleanText(q.presence.fc),n:cleanText(q.presence.n).slice(0,10)||'勇者'}));}catch(e){return [];}
}
function hubPush(m){hubChat.push(m);if(hubChat.length>80)hubChat.shift();
  const f=save.friends.find(x=>x.fc===m.fc);if(f&&m.from)f.name=m.from;
  if(tab==='friends')refreshFriends();}
let lastSend=0;
function hubSend(text,to,inv){
  text=cleanText(text).trim();if(!text&&!inv)return;
  if(Date.now()-lastSend<900)return;lastSend=Date.now();
  if(!hubRoom){hubPush({from:'系統',text:'尚未連線到大廳，無法送出',sys:true});return;}
  const d={n:(save.name||'勇者').slice(0,10),fc:save.fc,t:text};
  try{
    if(to){d.to=to;if(inv)d.inv=inv;hubRoom.emit('dm',d);hubPush({from:'我→'+((save.friends.find(f=>f.fc===to)||{}).name||to),fc:save.fc,text:text||'（邀請）',dm:true,mine:true});}
    else{hubRoom.emit('chat',d);hubPush({from:'我',fc:save.fc,text,mine:true});}
  }catch(e){hubPush({from:'系統',text:'送出失敗',sys:true});}
}
let flBox=null,logBox=null;
function refreshFriends(){
  if(!flBox||!logBox||!flBox.isConnected)return;
  const peers=hubPeers(),on=new Set(peers.map(p=>p.fc));
  for(const p of peers){const f=save.friends.find(x=>x.fc===p.fc);if(f)f.name=p.n;}
  flBox.textContent='';
  const fl=el('div','fl');
  for(const f of save.friends){
    const it=el('div','item');
    const t=el('b','');t.append(el('span','dot'+(on.has(f.fc)?' on':'')),document.createTextNode(f.name||f.fc));
    it.append(t,el('small','','代碼 '+f.fc+(on.has(f.fc)?'　在線上':'　離線')));
    const r=el('div','brow');
    const b1=el('button','btn',dmTo===f.fc?'私訊中':'私訊');b1.type='button';b1.addEventListener('click',()=>{dmTo=dmTo===f.fc?'':f.fc;refreshFriends();});
    const b2=el('button','btn','邀請同房');b2.type='button';b2.disabled=!on.has(f.fc);
    b2.addEventListener('click',()=>{if(!save.code){save.code=Math.random().toString(36).slice(2,8);persist();}hubSend('邀請你加入房間 '+save.code,f.fc,save.code);});
    const b3=el('button','btn','移除');b3.type='button';b3.addEventListener('click',()=>{save.friends=save.friends.filter(x=>x!==f);if(dmTo===f.fc)dmTo='';persist();refreshFriends();});
    r.append(b1,b2,b3);it.appendChild(r);fl.appendChild(it);
  }
  if(!save.friends.length)fl.appendChild(el('p','note','還沒有好友。輸入對方的好友代碼，或在下方「線上玩家」點加好友。'));
  flBox.appendChild(fl);
  flBox.appendChild(el('b','','線上玩家（大廳）'));
  const ol=el('div','fl');
  for(const p of peers){
    const it=el('div','item');it.append(el('b','',p.n),el('small','','代碼 '+p.fc));
    if(!save.friends.some(f=>f.fc===p.fc)){const b=el('button','btn','加好友');b.type='button';b.addEventListener('click',()=>{save.friends.push({fc:p.fc,name:p.n});persist();refreshFriends();});it.appendChild(b);}
    ol.appendChild(it);
  }
  if(!peers.length)ol.appendChild(el('p','note',hubRoom?'目前大廳沒有其他玩家。':(netRoomNs?'連線中…':'連線功能需要在已分享的頁面上才能使用。')));
  flBox.appendChild(ol);
  logBox.textContent='';
  for(const m of hubChat.slice(-40)){
    const d=el('div',m.dm?'dm':m.sys?'sys':'');
    d.textContent=(m.dm?'[私訊] ':'')+m.from+'：'+m.text;
    if(m.inv){const b=el('button','btn','加入房間 '+m.inv);b.type='button';b.style.cssText='margin-left:8px;font-size:12px;padding:2px 8px';b.addEventListener('click',()=>{save.code=m.inv;persist();toast('已設定房間代碼，回大廳按出發');});d.appendChild(b);}
    logBox.appendChild(d);
  }
  logBox.scrollTop=logBox.scrollHeight;
}
function hubFriends(){
  const box=el('div');box.style.cssText='display:flex;flex-direction:column;gap:12px';
  const r=el('div','row2');
  r.appendChild(el('span','','我的好友代碼：'));const my=el('b','',save.fc);my.style.color='var(--gold)';r.appendChild(my);
  const cp=el('button','btn','複製');cp.type='button';cp.addEventListener('click',()=>{try{navigator.clipboard.writeText(save.fc);toast('已複製');}catch(e){toast('請手動複製：'+save.fc);}});r.appendChild(cp);
  const l=el('label','','加好友 ');const inp=el('input');inp.maxLength=8;inp.placeholder='對方代碼';l.appendChild(inp);
  const ab=el('button','btn','加入');ab.type='button';
  ab.addEventListener('click',()=>{
    const c=inp.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!c||c===save.fc){toast('代碼無效');return;}
    if(save.friends.some(f=>f.fc===c)){toast('已經是好友');return;}
    save.friends.push({fc:c,name:c});persist();inp.value='';refreshFriends();
  });
  r.append(l,ab);box.appendChild(r);
  box.appendChild(el('p','note','好友與聊天走即時連線：雙方都在「好友」頁時才收得到訊息，不會保存離線訊息；聊天內容其他在線玩家可見（公開頻道）。私訊只會送給指定好友，但不是加密。請勿分享個人資訊。'));
  flBox=el('div');flBox.style.cssText='display:flex;flex-direction:column;gap:10px';box.appendChild(flBox);
  box.appendChild(el('b','','聊天'));
  logBox=el('div','chatlog');box.appendChild(logBox);
  const row=el('div','row2'),ci=el('input');ci.style.width='min(26em,100%)';ci.maxLength=60;ci.placeholder='輸入訊息…';
  const sb=el('button','btn','送出');sb.type='button';
  const go=()=>{hubSend(ci.value,dmTo);ci.value='';};
  sb.addEventListener('click',go);ci.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  row.append(ci,sb);row.appendChild(el('span','',dmTo?'':'（公開頻道）'));box.appendChild(row);
  bodyEl.appendChild(box);
  refreshFriends();hubJoin();
}
/* in-game chat */
let gchat=[];
function gameChatIn(d){
  const t=cleanText(d.t);if(!t)return;
  gchat.push({n:cleanText(d.n).slice(0,10)||'勇者',t,ts:Date.now()});if(gchat.length>30)gchat.shift();
}
function openChat(){
  if(!G||G.state!=='play')return;
  if(!G.co||!netJoined){gchat.push({n:'系統',t:'連線同房時才能聊天（先在大廳輸入房間代碼）',ts:Date.now()});return;}
  const i=$('chatIn');i.hidden=false;i.value='';i.focus();mouse.down=false;
}
(function(){
  const i=$('chatIn');if(!i)return;
  i.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){i.hidden=true;cv.focus({preventScroll:true});}
    else if(e.key==='Enter'){
      const t=cleanText(i.value).trim();i.hidden=true;cv.focus({preventScroll:true});
      if(t&&netJoined){
        const d={n:(save.name||'勇者').slice(0,10),t};
        try{netJoined.emit('chat',d);}catch(err){}gameChatIn(d);
      }
    }
  });
})();
function drawChat(){
  const now=Date.now(),list=gchat.filter(m=>now-m.ts<12000).slice(-5);
  if(!list.length)return;
  ctx.textAlign='left';ctx.font='13px '+FONT;
  list.forEach((m,i)=>{
    const a=clamp((12000-(now-m.ts))/1500,0,1),s=m.n+'：'+m.t,y=H-74-(list.length-1-i)*17;
    ctx.globalAlpha=a;ctx.fillStyle='rgba(10,12,18,.6)';ctx.fillRect(6,y-12,ctx.measureText(s).width+10,16);
    ctx.fillStyle='#e9ecf5';ctx.fillText(s,11,y);
  });
  ctx.globalAlpha=1;
}
/* ---------- settings ---------- */

  const r1=el('div','row2');

  rg.addEventListener('input',()=>{save.set.vol=rg.value/100;applySet();});rg.addEventListener('change',()=>{persist();sfx(600,.1,'triangle',.05,100);});lv.appendChild(rg);
  const bb=el('button','btn','背景音樂：'+(SET.bgm?'開':'關'));bb.type='button';bb.addEventListener('click',()=>{save.set.bgm=SET.bgm?0:1;applySet();persist();renderHub();});
  const fb=el('button','btn','特效品質：'+(SET.fx?'高':'低（手機較順）'));fb.type='button';fb.addEventListener('click',()=>{save.set.fx=SET.fx?0:1;applySet();persist();renderHub();});
  r1.append(lv,bb,fb);box.appendChild(r1);
  const tb=el('button','btn','重看新手教學');tb.type='button';tb.style.alignSelf='flex-start';tb.addEventListener('click',()=>{save.tut=0;persist();toast('下次出發時會顯示教學');});box.appendChild(tb);
  box.appendChild(el('b','','存檔匯出／匯入'));
  box.appendChild(el('p','note','把這段文字存起來，之後或換裝置時貼回來匯入。匯入會覆蓋目前存檔。'));
  const ta=el('textarea','ex');ta.spellcheck=false;box.appendChild(ta);
  const r2=el('div','brow');
  const ex=el('button','btn','匯出');ex.type='button';ex.addEventListener('click',()=>{try{ta.value='MJD1:'+btoa(unescape(encodeURIComponent(JSON.stringify(save))));ta.select();try{navigator.clipboard.writeText(ta.value);}catch(e){}toast('已匯出');}catch(e){toast('匯出失敗');}});
  const im=el('button','btn','匯入');im.type='button';im.addEventListener('click',()=>{
    try{
      const s=ta.value.trim();if(!s.startsWith('MJD1:'))throw 0;
      const o=JSON.parse(decodeURIComponent(escape(atob(s.slice(5)))));
      if(!o||typeof o!=='object'||!Array.isArray(o.chars))throw 0;
      save=Object.assign(SAVE0(),o);ensureHome();persist();toast('匯入成功');renderHub();
    }catch(e){toast('匯入失敗：格式不正確');}
  });
  r2.append(ex,im);box.appendChild(r2);
  box.appendChild(el('p','note','操作：WASD 移動、滑鼠射擊、Shift 閃避、空白鍵／右鍵 技能1、R 技能2、Q 換武器、E 互動（含傳送門）、C 捕捉、Y 聊天、T 自動瞄準、Esc 暫停。站定不動時射速更快。'));
  bodyEl.appendChild(box);
}
/* ---------- tutorial ---------- */
const TUT=[
 ['移動與射擊','WASD 或左搖桿移動，滑鼠或右側按鈕射擊。站定不動時射速更快，「站定射擊」強化會再加傷害。\nShift（閃避鍵）有無敵時間；在子彈快打到你時閃避會觸發「完美閃避」慢動作。'],
 ['房間與傳送門','清光敵人後右側的門會打開。守關王倒下後會出現傳送門，要按 E（手機按「互動」）才會進入下一層。\n守關王房有機率出現天使與惡魔：天使免費祝福，惡魔用最大生命換取兩次強化。'],
 ['技能與強化','空白鍵是角色專屬技能，R 是在技能庫裝備的第二技能。每清一個房間可三選一強化。\n鐵匠鋪可以進化武器，賭局房可以試手氣，商店用金幣買東西。'],
 ['寵物、裝備與家園','對虛弱的怪物按 C 丟捕捉球，捕到的寵物會在結算時加入。最多帶 2 隻寵物與 4 件裝備。\n家園會自動產出魔晶、飼料與寵物經驗，記得回大廳領取。']
];
function showTutorial(i){
  const t=TUT[i];
  showOv(t[0]+'（'+(i+1)+'/'+TUT.length+'）',t[1],[
    {label:i<TUT.length-1?'下一頁':'開始冒險',main:true,fn:()=>{if(i<TUT.length-1)showTutorial(i+1);else{hideOv();if(G&&G.state==='pause')G.state='play';cv.focus({preventScroll:true});}}}]);
}
/* ---------- bgm ---------- */
let bgmT=null,bgmStep=0;
function stopBgm(){if(bgmT){clearInterval(bgmT);bgmT=null;}}
function startBgm(){
  stopBgm();if(!SET.bgm)return;
  const sc=[0,3,5,7,10,12,15,17];
  bgmT=setInterval(()=>{
    if(!G||G.state!=='play'||muted||!SET.bgm)return;
    const k=(G.floor+(G.roomType==='boss'?5:0))%7,base=110*Math.pow(2,(k*2)/12),i=bgmStep++;
    const n=sc[(i*3+(i>>2))%8],boss=G.roomType==='boss';
    sfx(base*Math.pow(2,n/12)*(i%4===0?1:2),.26,'triangle',boss?.02:.013,0);
    if(i%8===0)sfx(base/2,.7,'sine',.022,0);
    if(boss&&i%2===0)sfx(base,.12,'square',.01,-20);
  },240);
}

/* ---------- screens & hub ---------- */
const menuEl=$('menu'),gameEl=$('game'),ov=$('ov'),tabsEl=$('tabs'),bodyEl=$('tabBody');
let tab='lobby';
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function showOv(title,sub,btns){
  $('ovT').textContent=title;$('ovS').textContent=sub;
  const row=$('ovB');row.textContent='';
  for(const b of btns){
    const e=el('button','btn'+(b.main?' main':''),b.label);e.type='button';e.addEventListener('click',b.fn);row.appendChild(e);
  }
  ov.hidden=false;
}
function hideOv(){ov.hidden=true;}
function showMenu(){
  stopBgm();netLeave();G=null;hideOv();gameEl.classList.add('hidden');menuEl.classList.remove('hidden');renderHub();
}
function startRun(ch){
  stopHub();hubLeave();
  menuEl.classList.add('hidden');gameEl.classList.remove('hidden');hideOv();
  sfx(440,.1,'triangle',.04,200);
  newRun(ch);startBgm();
  if(!save.tut){save.tut=1;persist();G.state='pause';showTutorial(0);}
  if(G.co)netJoin(save.code);
  cv.focus({preventScroll:true});
}
function togglePause(){
  if(!G||G.perkChoice)return;
  if(G.state==='play'){
    G.state='pause';mouse.down=false;touch.fire=false;
    showOv('暫停','目前已收集材料價值 '+runCrystals()+' 魔晶',[
      {label:'繼續',main:true,fn:togglePause},
      {label:'撤退結算',fn:()=>{G.state='play';hideOv();endRun(true);}}]);
  }else if(G.state==='pause'){G.state='play';hideOv();cv.focus({preventScroll:true});}
}
function hubUp(){
  const list=el('div','list');
  for(const u of UPG){
    const lv=save.upg[u.id]||0,it=el('div','item');
    it.append(el('b','',u.n),el('span','lv','Lv '+lv+' / '+u.max),el('small','',u.d));
    const cost=u.cost(lv),b=el('button','btn',lv>=u.max?'已滿級':'強化　'+cost+' 魔晶');b.type='button';
    b.disabled=lv>=u.max||save.crystals<cost;
    b.addEventListener('click',()=>{if(lv<u.max&&save.crystals>=cost){save.crystals-=cost;save.upg[u.id]=lv+1;persist();renderHub();}});
    it.appendChild(b);list.appendChild(it);
  }
  bodyEl.append(el('p','note','魔晶來自地下城掉落的材料：深入越多層，稀有材料越常出現，價值也越高（碎片 1、純淨晶 4、蒼藍晶 15、紫曜石 60、星核 250）。'),list);
}
function hubSk(){
  const list=el('div','list');
  const ids=Object.keys(SKILLS).filter(i=>SKILLS[i].unlock);
  for(const id of ids){
    const s=SKILLS[id],has=save.skills.includes(id),it=el('div','item');
    it.append(el('b','',s.n),el('span','lv','冷卻 '+s.cd+' 秒'),el('small','',s.d));
    if(has){
      const on=save.eq===id,b=el('button','btn',on?'卸下':'裝備為技能 2');b.type='button';
      b.addEventListener('click',()=>{save.eq=on?null:id;persist();renderHub();});it.appendChild(b);
    }else it.appendChild(el('small','','通關第 '+s.unlock+' 層守關王後解鎖'));
    list.appendChild(it);
  }
  bodyEl.append(el('p','note','每位角色自帶一個專屬技能（空白鍵）。這裡解鎖的技能可以再裝備一個（R 鍵或「技能2」按鈕）。'),list);
}
function hubLb(){
  const rows=netBoardList();
  if(!rows.length){bodyEl.appendChild(el('p','note',netBoardOk()?'還沒有人上榜，去闖一次吧。':'排行榜需要在已分享的頁面上，並以可寫入的身分開啟才會顯示與記錄。'));return;}
  const tw=el('div','tw'),t=el('table','lb'),h=el('tr');
  for(const s of ['#','暱稱','最深','擊殺','角色'])h.appendChild(el('th','',s));
  t.appendChild(h);
  rows.forEach((r,i)=>{
    const tr=el('tr');
    const ch=CHARS.find(c=>c.id===r.ch);
    for(const s of [String(i+1),String(r.name||'勇者').slice(0,10),'第 '+r.floor+' 層',String(r.kills||0),ch?ch.name:'-'])tr.appendChild(el('td','',s));
    t.appendChild(tr);

/* ---------- input ---------- */
function keyPressed(k){
  if(k==='escape'||k==='p'){togglePause();return;}
  if(G&&G.perkChoice&&k>='1'&&k<='3'){choosePerk(+k-1);return;}
  if(!G||G.state!=='play')return;
  if(k==='e'||k==='enter')interact();
  else if(k==='q')swapWeapon();
  else if(k===' ')castSkill(0);
  else if(k==='r'||k==='f')castSkill(1);
  else if(k==='t'){G.auto=!G.auto;addText(G.player.x,G.player.y-28,G.auto?'自動瞄準 開':'自動瞄準 關','#e9ecf5');}
  else if(k==='shift')doDash();
  else if(k==='c')tryCapture();
  else if(k==='y'){openChat();}
  else if(k==='m'){muted=!muted;}
}
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(G&&!gameEl.classList.contains('hidden')&&(k===' '||k.startsWith('arrow')))e.preventDefault();
  if(!keys[k])keyPressed(k);
  keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(G&&G.state==='play'&&!G.co)togglePause();});
function setMouse(e){
  const r=cv.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')setMouse(e);});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')return;
  setMouse(e);cv.focus({preventScroll:true});
  if(e.button===0)mouse.down=true;
  else if(e.button===2)castSkill(0);
});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button===0)mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{if(G&&G.state==='play'){e.preventDefault();swapWeapon();}},{passive:false});

const stick=$('stick'),knob=$('knob');let sid=null;
function moveStick(e){
  const r=stick.getBoundingClientRect(),m=r.width/2;
  let dx=e.clientX-(r.left+m),dy=e.clientY-(r.top+m);
  const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/m);
  dx=dx/d*k;dy=dy/d*k;
  touch.mx=Math.abs(dx)<.15?0:dx;touch.my=Math.abs(dy)<.15?0:dy;
  knob.style.transform='translate('+(dx*m*.6)+'px,'+(dy*m*.6)+'px)';
}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(x){}moveStick(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)moveStick(e);});
const endStick=e=>{if(e.pointerId===sid){sid=null;touch.mx=touch.my=0;knob.style.transform='';}};
stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
const bF=$('bFire');
bF.addEventListener('pointerdown',e=>{touch.fire=true;try{bF.setPointerCapture(e.pointerId);}catch(x){}});
const endF=()=>{touch.fire=false;};
bF.addEventListener('pointerup',endF);bF.addEventListener('pointercancel',endF);
$('bSkill').addEventListener('pointerdown',()=>castSkill(0));
$('bSkill2').addEventListener('pointerdown',()=>castSkill(1));
$('bSwap').addEventListener('pointerdown',()=>swapWeapon());
$('bUse').addEventListener('pointerdown',()=>interact());
$('bDash').addEventListener('pointerdown',()=>doDash());
$('bCap').addEventListener('pointerdown',()=>tryCapture());
$('bChat').addEventListener('pointerdown',()=>openChat());

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(G&&(G.state==='play'||G.state==='over')&&!(G.perkChoice&&!G.co))update(dt);
  render();
  requestAnimationFrame(frame);
}
loadLocal();
renderHub();
requestAnimationFrame(frame);
netInit();
})();
</script>
